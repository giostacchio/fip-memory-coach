laborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Skip pass e close-out",players:[["1",20,60,!0],["2",82,58,!1],["3",50,38,!1],["X1",28,54,!1],["X2",60,43,!1]],arrows:[["pass",27,57,56,0],["def",58,44,26,29],["move",78,54,28,-100]],steps:["1 legge la difesa raccolta sul lato palla ed esegue uno skip pass a 2.","X2 ruota con un close-out lungo per recuperare lo spazio-tempo.","2 legge il close-out: tiro se ha vantaggio oppure attacco dello spazio con partenza e cambio di velocità."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Blocco sulla palla: roll",players:[["1",27,72,!0],["5",52,62,!1],["2",80,47,!1],["X1",33,63,!1],["X5",56,50,!1]],arrows:[["move",34,67,35,-31],["move",53,58,34,-73],["pass",51,48,28,-46]],steps:["5 porta il blocco sulla palla rispettando spazio e angolo.","1 usa il blocco e legge il comportamento di X1 e X5.","5 effettua giro dorsale in assenza di spazio, poi rolla; 1 passa se la linea è aperta."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Blocco sulla palla: pop ed extra-pass",players:[["1",28,72,!0],["5",51,59,!1],["2",81,47,!1],["X1",34,64,!1],["X5",55,47,!1],["X2",70,42,!1]],arrows:[["move",34,67,34,-32],["move",53,58,27,75],["pass",50,52,33,52],["pass",62,73,37,-59]],steps:["1 usa il blocco e impegna due difensori.","5 legge spazio esterno ed esegue giro frontale, più veloce in presenza di spazio, aprendosi fuori.","Se X2 aiuta su 5, la palla prosegue con extra-pass a 2 per mantenere il vantaggio."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Uscita dal blocco: ricciolo",players:[["1",23,76,!0],["2",73,66,!1],["5",57,55,!1],["X2",66,59,!1],["X5",52,46,!1]],arrows:[["move",69,64,36,-112],["pass",29,70,40,-43],["def",64,58,26,-96]],steps:["2 utilizza il blocco di 5 e taglia a ricciolo vedendo spazio interno.","X2 insegue; X5 deve decidere se aiutare sulla linea di penetrazione.","1 passa nel tempo giusto al punto futuro del taglio; 2 mantiene o concretizza il vantaggio."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Back-door contro anticipo chiuso",players:[["1",22,62,!0],["2",75,51,!1],["X2",66,49,!1],["X1",29,56,!1]],arrows:[["move",72,54,40,132],["pass",29,60,49,8],["def",64,48,24,167]],steps:["X2 dà priorità al tiratore e gioca anticipo chiuso col petto verso 2.","2 legge la linea negata, cambia direzione e taglia back-door nello spazio dietro.","1 ruba tempo con passaggio diretto dal palleggio verso lo spazio del taglio."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-tempo, vantaggio e collaborazioni",sourceUrl:"https://cna.fip.it/wp-content/uploads/2023/05/playbook_n_6.pdf"},{title:"Aiuto, rotazione e seconda rotazione",players:[["1",20,74,!0],["2",80,51,!1],["3",82,76,!1],["X1",27,66,!1],["X2",52,42,!1],["X3",72,67,!1]],arrows:[["move",28,68,31,-59],["def",54,43,27,32],["pass",47,45,35,14],["def",71,65,26,-68],["pass",77,54,28,65]],steps:["1 prende vantaggio; X2 aiuta per non concedere un tiro ad alta percentuale.","1 scarica a 2 mentre X3 effettua la prima rotazione.","2 mantiene il vantaggio con extra-pass a 3; la difesa deve completare la seconda rotazione."],source:"Rielaborazione originale su concetti ufficiali CNA/FIP: lettura anticipata, spazio-t
