<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIP Memory Coach</title><style>:root{--n:#102738;--b:#155f81;--c:#32c6d4;--p:#f4f1e9;--o:#f4653f;--l:#d8d7cf;--i:#10202d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{background:var(--n);color:#fff;padding:22px max(18px,calc((100vw - 1180px)/2));border-bottom:4px solid var(--c);display:flex;justify-content:space-between}.top b{letter-spacing:.1em}.tabs{position:sticky;top:0;z-index:5;background:#fff;display:flex;justify-content:center;border-bottom:1px solid var(--l);overflow:auto}.tabs button{padding:17px 22px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;white-space:nowrap}.tabs .on{color:var(--b);border-color:var(--o)}.page{max-width:1180px;margin:auto;padding:30px 20px 60px}.hero,.head{background:var(--n);color:#fff;border-radius:22px;padding:34px}.hero h1,.head h1{font-size:42px;margin:8px 0}.hero p,.head p{color:#c4d6de;line-height:1.6}.primary{border:0;background:var(--o);color:#fff;padding:13px 18px;border-radius:9px;font-weight:800}.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.plan article,.card,.lesson,.steps article{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px}.plan b{display:block;color:var(--o);font-size:12px;margin-bottom:8px}.split{display:grid;grid-template-columns:330px 1fr;gap:24px}.side{background:var(--n);color:#fff;border-radius:18px;padding:20px;max-height:calc(100vh - 95px);overflow:auto;position:sticky;top:75px}.side input{width:100%;padding:11px;border-radius:8px;border:1px solid #466473;background:#0b202d;color:#fff;margin:10px 0}.group{margin:18px 0 7px;color:var(--c);font-size:11px;letter-spacing:.1em;font-weight:800}.side button{width:100%;display:grid;grid-template-columns:28px 1fr auto;text-align:left;padding:11px 8px;background:none;border:0;border-top:1px solid #294553;color:#cad8de}.side button.on{background:#1a3b4c;color:#fff;border-radius:8px}.side small{color:var(--o)}.lesson h1{font-size:34px}.purpose{border-left:5px solid var(--o);background:#fff4ec;padding:16px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keys div{background:var(--p);padding:14px;border-radius:10px}.keys b{background:var(--b);color:#fff;border-radius:50%;padding:5px 9px}.recall{background:var(--n);color:#fff;padding:22px;border-radius:13px;margin:22px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;line-height:1.55}.diagram-nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.diagram-nav button{border:1px solid var(--l);background:#fff;border-radius:9px;padding:10px 13px;white-space:nowrap}.diagram-nav .on{background:var(--b);color:#fff}.diagram{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.court{height:560px;position:relative;background:#e8b77b;border:4px solid #fff;box-shadow:0 0 0 1px #b78450;border-radius:5px;overflow:hidden}.court:before{content:'';position:absolute;top:0;left:35%;width:30%;height:28%;border:3px solid #fff}.court:after{content:'◉';position:absolute;top:15px;left:48%;color:var(--o);font-size:28px}.pl{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:bold;z-index:2}.pl.ball:after{content:'●';color:var(--o);position:absolute;right:-11px}.arrow{position:absolute;height:0;border-top:5px solid var(--o);transform-origin:left center}.arrow.pass{border-top:4px dashed var(--n)}.arrow:after{content:'';position:absolute;right:-2px;top:-8px;border-left:12px solid var(--o);border-top:6px solid transparent;border-bottom:6px solid transparent}.arrow.pass:after{border-left-color:var(--n)}.steps{display:grid;gap:10px}.steps article b{color:var(--o);margin-right:8px}.challenge{background:var(--n);color:#fff;padding:20px;border-radius:13px;line-height:1.6}.exam{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.card textarea{width:100%;min-height:220px;padding:12px}.answers button{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border:1px solid var(--l);background:#fafafa;border-radius:8px}.good{background:#dff5ef!important}.bad{background:#ffe5df!important}.tag{font-size:11px;letter-spacing:.1em;color:var(--o);font-weight:bold}@media(max-width:800px){.split,.diagram,.exam,.cols{grid-template-columns:1fr}.side{position:static;max-height:none}.plan,.keys{grid-template-columns:1fr}.hero h1,.head h1{font-size:34px}.court{height:440px}}</style></head><body><header class="top"><b>🏀 FIP MEMORY COACH</b><span id="count"></span></header><nav class="tabs" id="tabs"></nav><main id="app"></main><script>const D={"topics":[{"id":"difesa","title":"Posizione e difesa sulla palla","area":"Difesa","icon":"◇","use":"Contenere l’attaccante, togliere spazio utile e recuperare la palla.","keys":["Equilibrio e reattività","Distanza adeguata","Petto davanti alla palla"],"technique":["Piedi attivi, base stabile e busto pronto.","Scivolare senza incrociare i piedi quando possibile.","Mani attive coerenti con palla e linee di passaggio."],"tactics":"La distanza cambia secondo capacità dell’attaccante, posizione della palla e spazio da proteggere.","errors":["Peso sui talloni","Piedi che si uniscono","Cercare la palla perdendo posizione"],"exam":"La difesa sulla palla nasce dalla posizione fondamentale e dalla distanza. Il difensore deve rimanere equilibrato, orientare l’attaccante e mantenere il petto davanti alla palla, usando piedi e mani in modo coordinato."},{"id":"posizione-off","title":"Posizione fondamentale offensiva","area":"Senza palla","icon":"△","use":"Preparare ogni movimento offensivo mantenendo equilibrio e possibilità di scelta.","keys":["Piedi alla larghezza delle spalle","Gambe piegate e peso sull’avampiede","Testa alta e corpo pronto"],"technique":["Base stabile ma non rigida.","Ginocchia e caviglie piegate.","Tronco leggermente inclinato e mani pronte."],"tactics":"È la posizione di partenza per ricevere, passare, tirare, partire o cambiare direzione.","errors":["Gambe tese","Peso sui talloni","Sguardo basso"],"exam":"Posizione fondamentale offensiva: Preparare ogni movimento offensivo mantenendo equilibrio e possibilità di scelta. Gli elementi tecnici essenziali sono: Base stabile ma non rigida. Ginocchia e caviglie piegate. Tronco leggermente inclinato e mani pronte. Dal punto di vista tattico, è la posizione di partenza per ricevere, passare, tirare, partire o cambiare direzione."},{"id":"corsa-cestistica","title":"Corsa cestistica","area":"Senza palla","icon":"➜","use":"Muoversi velocemente mantenendo visione, equilibrio e disponibilità a ricevere.","keys":["Testa alta","Passi rapidi e naturali","Mani pronte"],"technique":["Il busto resta controllato e orientato al gioco.","La corsa si adatta a spazio e traiettoria.","Le mani sono pronte a ricevere senza interrompere il movimento."],"tactics":"Serve a occupare lo spazio vantaggioso nel minor tempo possibile.","errors":["Guardare a terra","Correre senza leggere palla e compagni","Rallentare prima della ricezione"],"exam":"Corsa cestistica. Muoversi velocemente mantenendo visione, equilibrio e disponibilità a ricevere. Tecnica: Il busto resta controllato e orientato al gioco. La corsa si adatta a spazio e traiettoria. Le mani sono pronte a ricevere senza interrompere il movimento. Tattica: Serve a occupare lo spazio vantaggioso nel minor tempo possibile."},{"id":"cambio-vel-senza","title":"Cambio di velocità senza palla","area":"Senza palla","icon":"⚡","use":"Creare separazione dal difensore variando il ritmo della corsa.","keys":["Rallentare in modo credibile","Leggere la reazione","Accelerare nello spazio"],"technique":["Il giocatore modifica frequenza e ampiezza dei passi.","Il baricentro resta pronto alla ripartenza.","L’accelerazione avviene subito dopo la reazione difensiva."],"tactics":"Serve a prendere vantaggio e a liberare una linea di passaggio.","errors":["Correre sempre allo stesso ritmo","Rallentamento poco credibile","Nessuna accelerazione finale"],"exam":"Cambio di velocità senza palla. Creare separazione dal difensore variando il ritmo della corsa. Tecnica: Il giocatore modifica frequenza e ampiezza dei passi. Il baricentro resta pronto alla ripartenza. L’accelerazione avviene subito dopo la reazione difensiva. Tattica: Serve a prendere vantaggio e a liberare una linea di passaggio."},{"id":"cambio-dir-omo","title":"Cambio di direzione omologo senza palla","area":"Senza palla","icon":"⤴","use":"Cambiare direzione usando come appoggio il piede dello stesso lato della nuova traiettoria.","keys":["Frenata nello spazio","Appoggio omologo","Spinta e accelerazione"],"technique":["Il giocatore abbassa il baricentro.","Il piede omologo orienta la nuova direzione.","La ripartenza avviene con cambio di ritmo."],"tactics":"Serve a smarcarsi leggendo spazio, difensore e tempo del passaggio.","errors":["Cambio curvo","Nessuna frenata","Ripartenza lenta"],"exam":"Cambio di direzione omologo senza palla: Cambiare direzione usando come appoggio il piede dello stesso lato della nuova traiettoria. Gli elementi tecnici essenziali sono: Il giocatore abbassa il baricentro. Il piede omologo orienta la nuova direzione. La ripartenza avviene con cambio di ritmo. Dal punto di vista tattico, serve a smarcarsi leggendo spazio, difensore e tempo del passaggio."},{"id":"cambio-dir-inc","title":"Cambio di direzione incrociato senza palla","area":"Senza palla","icon":"⤵","use":"Cambiare direzione spingendo sul piede opposto alla nuova traiettoria.","keys":["Frenata e baricentro basso","Spinta sul piede opposto","Taglio netto e accelerazione"],"technique":["L’appoggio esterno arresta la prima corsa.","Il corpo ruota verso lo spazio nuovo.","I primi passi successivi sono rapidi."],"tactics":"Si usa per battere il difensore con un taglio netto, soprattutto sotto pressione ravvicinata.","errors":["Passi piccoli prima del cambio","Traiettoria arrotondata","Non mostrare le mani al passatore"],"exam":"Cambio di direzione incrociato senza palla: Cambiare direzione spingendo sul piede opposto alla nuova traiettoria. Gli elementi tecnici essenziali sono: L’appoggio esterno arresta la prima corsa. Il corpo ruota verso lo spazio nuovo. I primi passi successivi sono rapidi. Dal punto di vista tattico, si usa per battere il difensore con un taglio netto, soprattutto sotto pressione ravvicinata."},{"id":"giro-frontale","title":"Giro frontale","area":"Senza palla","icon":"↶","use":"Cambiare fronte mantenendo il campo davanti agli occhi.","keys":["Perno stabile","Petto aperto al campo","Ripartenza equilibrata"],"technique":["Il piede perno resta a contatto col terreno.","Il piede libero ruota davanti al corpo.","Testa e busto anticipano la nuova direzione."],"tactics":"Si usa quando è importante conservare visione della palla e dello spazio.","errors":["Spostare il perno","Ruotare rigidi","Perdere la visione"],"exam":"Giro frontale. Cambiare fronte mantenendo il campo davanti agli occhi. Tecnica: Il piede perno resta a contatto col terreno. Il piede libero ruota davanti al corpo. Testa e busto anticipano la nuova direzione. Tattica: Si usa quando è importante conservare visione della palla e dello spazio."},{"id":"giro-dorsale","title":"Giro dorsale","area":"Senza palla","icon":"↷","use":"Cambiare fronte proteggendo spazio e palla con il dorso.","keys":["Perno stabile","Dorso in protezione","Uscita rapida"],"technique":["Il piede libero passa dietro al corpo.","Il busto ruota vicino all’asse del perno.","La testa recupera subito la visione del gioco."],"tactics":"Si usa sotto pressione ravvicinata per proteggere la traiettoria.","errors":["Giro largo","Perno che scivola","Uscita lenta"],"exam":"Giro dorsale. Cambiare fronte proteggendo spazio e palla con il dorso. Tecnica: Il piede libero passa dietro al corpo. Il busto ruota vicino all’asse del perno. La testa recupera subito la visione del gioco. Tattica: Si usa sotto pressione ravvicinata per proteggere la traiettoria."},{"id":"arresto-uno","title":"Arresto ad un tempo","area":"Senza palla","icon":"▣","use":"Fermare il movimento atterrando contemporaneamente sui due piedi.","keys":["Stacco controllato","Appoggio simultaneo","Equilibrio e libertà di perno"],"technique":["Breve fase di volo.","I piedi arrivano contemporaneamente a terra.","Caviglie, ginocchia e anche ammortizzano l’impatto."],"tactics":"Consente di scegliere il piede perno e risulta utile quando serve equilibrio immediato.","errors":["Atterrare rigidi","Piedi troppo stretti","Perdere il controllo in avanti"],"exam":"Arresto ad un tempo: Fermare il movimento atterrando contemporaneamente sui due piedi. Gli elementi tecnici essenziali sono: Breve fase di volo. I piedi arrivano contemporaneamente a terra. Caviglie, ginocchia e anche ammortizzano l’impatto. Dal punto di vista tattico, consente di scegliere il piede perno e risulta utile quando serve equilibrio immediato."},{"id":"arresto-due","title":"Arresto a due tempi","area":"Senza palla","icon":"Ⅱ","use":"Fermare la corsa con due appoggi successivi e controllati.","keys":["Primo appoggio frena","Secondo appoggio equilibra","Il primo piede diventa perno"],"technique":["Gli appoggi avvengono in successione.","Il baricentro si abbassa durante la frenata.","Il corpo termina stabile e orientato."],"tactics":"Si usa per adattare l’arresto a traiettoria, velocità e spazio disponibile.","errors":["Appoggi troppo lunghi","Baricentro alto","Confondere il piede perno"],"exam":"Arresto a due tempi: Fermare la corsa con due appoggi successivi e controllati. Gli elementi tecnici essenziali sono: Gli appoggi avvengono in successione. Il baricentro si abbassa durante la frenata. Il corpo termina stabile e orientato. Dal punto di vista tattico, si usa per adattare l’arresto a traiettoria, velocità e spazio disponibile."},{"id":"dif-posizione","title":"Posizione fondamentale difensiva","area":"Difesa","icon":"◇","use":"Essere pronti a qualunque movimento funzionale alla difesa.","keys":["Piedi vivi e più larghi delle spalle","Peso sugli avampiedi","Mani attive e capo eretto"],"technique":["Caviglie e ginocchia sono piegate.","I palmi sono rivolti verso la palla.","La distanza varia con la posizione della palla."],"tactics":"Palla bassa: distanza maggiore. Palla alta: distanza minore.","errors":["Peso sui talloni","Gambe tese","Mani passive"],"exam":"Posizione fondamentale difensiva. Essere pronti a qualunque movimento funzionale alla difesa. Tecnica: Caviglie e ginocchia sono piegate. I palmi sono rivolti verso la palla. La distanza varia con la posizione della palla. Tattica: Palla bassa: distanza maggiore. Palla alta: distanza minore."},{"id":"dif-palleggiatore","title":"Posizione sul palleggiatore","area":"Difesa","icon":"⊙","use":"Contenere il palleggiatore e ostacolare passaggio e cambio di mano.","keys":["Petto davanti","Mano opposta bassa","Mano concorde traccia la palla"],"technique":["Si parte dalla posizione fondamentale.","La mano opposta a quella di palleggio sta tra le ginocchia dell’attaccante.","L’altra mano segue la palla e chiude la linea di passaggio."],"tactics":"La distanza si adatta ad altezza della palla, velocità e pericolosità.","errors":["Avvicinarsi senza equilibrio","Cercare la palla col corpo","Mani entrambe alte"],"exam":"Posizione sul palleggiatore. Contenere il palleggiatore e ostacolare passaggio e cambio di mano. Tecnica: Si parte dalla posizione fondamentale. La mano opposta a quella di palleggio sta tra le ginocchia dell’attaccante. L’altra mano segue la palla e chiude la linea di passaggio. Tattica: La distanza si adatta ad altezza della palla, velocità e pericolosità."},{"id":"scivolamenti","title":"Scivolamenti difensivi","area":"Difesa","icon":"⇔","use":"Mantenere il corpo davanti all’attaccante senza perdere equilibrio.","keys":["Spinta del piede opposto","Piedi non si incrociano","Base stabile e mani attive"],"technique":["Il primo piede apre nella direzione.","Il secondo recupera senza unire i piedi.","Il baricentro resta basso e controllato."],"tactics":"Si alternano a corsa e recupero secondo distanza e velocità dell’attaccante.","errors":["Piedi che si toccano","Saltellare","Busto troppo alto"],"exam":"Scivolamenti difensivi: Mantenere il corpo davanti all’attaccante senza perdere equilibrio. Gli elementi tecnici essenziali sono: Il primo piede apre nella direzione. Il secondo recupera senza unire i piedi. Il baricentro resta basso e controllato. Dal punto di vista tattico, si alternano a corsa e recupero secondo distanza e velocità dell’attaccante."},{"id":"scivolo-corro","title":"Scivolo, corro, scivolo","area":"Difesa","icon":"⇢","use":"Recuperare lo spazio-tempo perso e tornare a contenere.","keys":["Incrocio per correre","Busto aperto alla palla","Ritorno in posizione"],"technique":["Dalla posizione difensiva si passa alla corsa incrociando i piedi.","Il busto resta aperto verso la palla.","Recuperato lo spazio si torna a scivolare."],"tactics":"Si usa quando il solo scivolamento non basta a recuperare il palleggiatore.","errors":["Correre guardando altrove","Restare in corsa troppo a lungo","Non ristabilire la base"],"exam":"Scivolo, corro, scivolo. Recuperare lo spazio-tempo perso e tornare a contenere. Tecnica: Dalla posizione difensiva si passa alla corsa incrociando i piedi. Il busto resta aperto verso la palla. Recuperato lo spazio si torna a scivolare. Tattica: Si usa quando il solo scivolamento non basta a recuperare il palleggiatore."},{"id":"posizionamento-dif","title":"Linee del posizionamento difensivo","area":"Difesa","icon":"╱","use":"Orientarsi rispetto a palla, canestro e giocatori senza palla.","keys":["Linea di passaggio","Linea di penetrazione","Linea della palla"],"technique":["La linea di passaggio unisce palla e ricevente.","La linea di penetrazione unisce palla e canestro.","La linea della palla è parallela alla linea di fondo e passa per la palla."],"tactics":"Le tre linee guidano posizione, aiuto, anticipo e rotazioni.","errors":["Seguire solo il proprio uomo","Ignorare il canestro","Restare fermi mentre si muove la palla"],"exam":"Linee del posizionamento difensivo. Orientarsi rispetto a palla, canestro e giocatori senza palla. Tecnica: La linea di passaggio unisce palla e ricevente. La linea di penetrazione unisce palla e canestro. La linea della palla è parallela alla linea di fondo e passa per la palla. Tattica: Le tre linee guidano posizione, aiuto, anticipo e rotazioni."},{"id":"anticipo-chiuso","title":"Anticipo chiuso","area":"Difesa","icon":"◀","use":"Negare la ricezione dando priorità al giocatore senza palla.","keys":["Petto verso l’uomo","Piede e mano lato palla sulla linea","Visione periferica"],"technique":["Posizione di taglio con petto verso l’avversario.","Palmo della mano d’anticipo verso la palla e pollice in basso.","Piccoli scivolamenti mantengono la linea."],"tactics":"Si usa soprattutto contro grandi tiratori per non perdere il contatto visivo.","errors":["Girare la testa perdendo la palla","Braccio rigido","Essere battuti back-door"],"exam":"Anticipo chiuso. Negare la ricezione dando priorità al giocatore senza palla. Tecnica: Posizione di taglio con petto verso l’avversario. Palmo della mano d’anticipo verso la palla e pollice in basso. Piccoli scivolamenti mantengono la linea. Tattica: Si usa soprattutto contro grandi tiratori per non perdere il contatto visivo."},{"id":"anticipo-aperto","title":"Anticipo aperto","area":"Difesa","icon":"▶","use":"Controllare uomo e palla dando priorità al giocatore con palla.","keys":["Petto verso la palla","Mano sulla linea di passaggio","Pollice verso l’alto"],"technique":["Il corpo è orientato verso la palla.","Piede e mano lato uomo occupano la linea.","La visione periferica comprende palla e avversario."],"tactics":"Si usa contro forti penetratori per leggere aiuto e rotazione nel tempo giusto.","errors":["Perdere l’uomo","Stare troppo alti","Anticipare senza proteggere il taglio"],"exam":"Anticipo aperto. Controllare uomo e palla dando priorità al giocatore con palla. Tecnica: Il corpo è orientato verso la palla. Piede e mano lato uomo occupano la linea. La visione periferica comprende palla e avversario. Tattica: Si usa contro forti penetratori per leggere aiuto e rotazione nel tempo giusto."},{"id":"difesa-no-palla","title":"Difesa sul giocatore senza palla","area":"Difesa","icon":"◆","use":"Negare ricezioni vantaggiose mantenendo visione di palla e uomo.","keys":["Posizione rispetto alla palla","Linea di passaggio controllata","Vedere uomo e palla"],"technique":["Piede e mano lato palla occupano la linea utile.","Il corpo si orienta secondo distanza e pericolosità.","La posizione cambia mentre la palla si muove."],"tactics":"Può essere più aggressiva o di contenimento, ma deve proteggere tagli e spazi pericolosi.","errors":["Guardare solo la palla","Perdere il contatto visivo con l’uomo","Posizione statica"],"exam":"Difesa sul giocatore senza palla: Negare ricezioni vantaggiose mantenendo visione di palla e uomo. Gli elementi tecnici essenziali sono: Piede e mano lato palla occupano la linea utile. Il corpo si orienta secondo distanza e pericolosità. La posizione cambia mentre la palla si muove. Dal punto di vista tattico, può essere più aggressiva o di contenimento, ma deve proteggere tagli e spazi pericolosi."},{"id":"linea-passaggio","title":"Linea di passaggio e anticipo","area":"Difesa","icon":"╱","use":"Ostacolare o negare il collegamento tra passatore e ricevente.","keys":["Corpo sulla linea utile","Braccio semiflesso attivo","Equilibrio per contenere il taglio"],"technique":["Il difensore occupa la linea con piede e mano lato palla.","Il petto è orientato secondo la scelta difensiva.","La distanza consente anticipo senza essere battuti facilmente."],"tactics":"La pressione sulla linea dipende da posizione della palla, spazio e rischio di taglio back-door.","errors":["Braccio rigido","Corpo completamente girato","Anticipo senza copertura dello spazio dietro"],"exam":"Linea di passaggio e anticipo: Ostacolare o negare il collegamento tra passatore e ricevente. Gli elementi tecnici essenziali sono: Il difensore occupa la linea con piede e mano lato palla. Il petto è orientato secondo la scelta difensiva. La distanza consente anticipo senza essere battuti facilmente. Dal punto di vista tattico, la pressione sulla linea dipende da posizione della palla, spazio e rischio di taglio back-door."},{"id":"presa","title":"Presa e ricezione della palla","area":"Attacco","icon":"◉","use":"Controllare immediatamente la palla ed essere pronti alla scelta successiva.","keys":["Mani pronte e bersaglio","Ammortizzare la ricezione","Palla protetta e visione"],"technique":["Dita aperte e pollici orientati secondo la traiettoria.","Le braccia accompagnano la palla verso il corpo.","Dopo la presa si recuperano equilibrio e posizione fondamentale."],"tactics":"La ricezione deve avvenire nel tempo e nello spazio utili, già orientati verso il gioco.","errors":["Aspettare la palla con mani basse","Corpo rigido","Guardare solo la palla"],"exam":"Presa e ricezione della palla: Controllare immediatamente la palla ed essere pronti alla scelta successiva. Gli elementi tecnici essenziali sono: Dita aperte e pollici orientati secondo la traiettoria. Le braccia accompagnano la palla verso il corpo. Dopo la presa si recuperano equilibrio e posizione fondamentale. Dal punto di vista tattico, la ricezione deve avvenire nel tempo e nello spazio utili, già orientati verso il gioco."},{"id":"palleggio","title":"Palleggio","area":"Attacco","icon":"●","use":"Spostarsi con la palla, creare vantaggio e migliorare una linea di passaggio.","keys":["Spinta con polso e dita","Testa alta e visione del gioco","Palla protetta e controllo del corpo"],"technique":["Mano sopra e leggermente dietro la palla.","Spinta elastica con polso e dita, senza schiaffeggiare.","Altezza e dis o improvvisamente ritmo e velocità. Gli elementi tecnici essenziali sono: Il palleggio rallenta e può alzarsi leggermente. Il corpo simula una pausa o un arresto. La ripartenza avviene con passo lungo e palleggio spinto. Dal punto di vista tattico, serve a sbilanciare un difensore che sta controllando la stessa velocità."},{"id":"cambio","title":"Cambio frontale incrociato e omologo","area":"Palleggio","icon":"↔","use":"Cambiare direzione leggendo spazio e distanza dal difensore.","keys":["Cambio basso sotto le ginocchia","Avviene prima dell’ostacolo o difensore","Accelerazione immediata dopo il cambio"],"technique":["Incrociato: il piede opposto alla nuova mano attacca lo spazio.","Omologo: il piede dello stesso lato della nuova mano anticipa l’uscita.","La mano passa da sopra a sopra-laterale della palla."],"tactics":"Difensore vicino: privilegiare l’incrociato. Spazio maggiore o difensore lontano: l’omologo consente di anticipare l’uscita.","errors":["Cambio troppo alto","Cambio eseguito sotto o dopo il difensore","Nessuna accelerazione in uscita"],"exam":"Il cambio di mano frontale permette di cambiare direzione davanti al corpo. Si prepara con palleggio controllato, si esegue basso e prima del difensore, quindi si accelera. La scelta tra incrociato e omologo dipende soprattutto dalla distanza e dallo spazio disponibile."},{"id":"cambio-omo-pal","title":"Cambio di mano frontale omologo","area":"Palleggio","icon":"⤡","use":"Cambiare mano e direzione con appoggio dello stesso lato della nuova mano.","keys":["Cambio prima del difensore","Appoggio omologo","Accelerazione immediata"],"technique":["La palla passa bassa davanti al corpo.","Il piede dello stesso lato della nuova mano orienta l’uscita.","La mano riceve e spinge nello spazio."],"tactics":"È utile con distanza maggiore dal difensore e spazio per anticipare l’uscita.","errors":["Cambio alto","Appoggio tardivo","Uscita senza velocità"],"exam":"Cambio di mano frontale omologo. Cambiare mano e direzione con ap ":"Senza palla","icon":"↻","use":"Proteggere la palla e cambiare orientamento senza commettere passi.","keys":["Perno stabile","Passi brevi con il piede libero","Palla protetta e testa alta"],"technique":["Il piede perno mantiene il contatto con il terreno.","Il corpo ruota in equilibrio.","La palla resta lontana dalla pressione difensiva."],"tactics":"Serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso.","errors":["Spostare il perno","Ruotare senza vedere il campo","Esporre la palla"],"exam":"Piede perno e giro: Proteggere la palla e cambiare orientamento senza commettere passi. Gli elementi tecnici essenziali sono: Il piede perno mantiene il contatto con il terreno. Il corpo ruota in equilibrio. La palla resta lontana dalla pressione difensiva. Dal punto di vista tattico, serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso."},{"id":"passaggio","title":"Passaggio","area":"Attacco","icon":"⇢","use":"Far arrivare la palla al punto giusto nel momento giusto e mantenere il vantaggio.","keys":["Leggere la linea aperta","Precisione e tempo corretto","Collaborazione tra passatore e ricevente"],"technique":["Equilibrio e presa sicura.","Spinta coordinata di gambe, braccia, polsi e dita.","Il tipo di passaggio dipende dalla linea disponibile."],"tactics":"Petto, schiacciato, sopra la testa, laterale, baseball, consegnato o da palleggio si scelgono leggendo spazio e difesa.","errors":["Passaggio lento o telefonato","Non guardare il difensore","Ricevente fermo senza mostrare un bersaglio"],"exam":"Il passaggio serve a mantenere il vantaggio facendo arrivare la palla al punto giusto nel momento giusto. Tecnica e scelta non sono separate: il giocatore usa il passaggio adatto alla linea lasciata libera dalla difesa."},{"id":"pass-petto","title":"Passaggio due mani dal petto","area":"Passaggio","icon":"⇉","use":"Servire rapidamente un compagno su una linea diretta aperta.","keys":["Palla davanti al petto","Spinta di gambe, braccia e polsi","Frustata finale e passo"],"technique":["Mani dietro la palla e gomiti naturalmente stretti.","Braccia distese verso il bersaglio.","Pollici, indici e medi completano la spinta."],"tactics":"Si usa su linea diretta, spesso in contropiede o contro una difesa a zona.","errors":["Gomiti larghi","Palla lenta ad arco","Passo fuori direzione"],"exam":"Passaggio due mani dal petto: Servire rapidamente un compagno su una linea diretta aperta. Gli elementi tecnici essenziali sono: Mani dietro la palla e gomiti naturalmente stretti. Braccia distese verso il bersaglio. Pollici, indici e medi completano la spinta. Dal punto di vista tattico, si usa su linea diretta, spesso in contropiede o contro una difesa a zona."},{"id":"pass-schiacciato","title":"Passaggio due mani schiacciato","area":"Passaggio","icon":"↘","use":"Superare braccia o pressione usando la linea bassa.","keys":["Partenza dalla cintola","Rimbalzo circa a due terzi","Ricezione all’altezza utile"],"technique":["Tecnica simile al passaggio dal petto.","La spinta è orientata verso il terreno.","La traiettoria deve restare tesa e prevedibile per il compagno."],"tactics":"Si usa quando la linea aerea è chiusa e c’è spazio vicino al terreno.","errors":["Rimbalzo troppo vicino","Passaggio molle","Usarlo con difensore a contatto sulla linea bassa"],"exam":"Passaggio due mani schiacciato: Superare braccia o pressione usando la linea bassa. Gli elementi tecnici essenziali sono: Tecnica simile al passaggio dal petto. La spinta è orientata verso il terreno. La traiettoria deve restare tesa e prevedibile per il compagno. Dal punto di vista tattico, si usa quando la linea aerea è chiusa e c’è spazio vicino al terreno."},{"id":"pass-testa","title":"Passaggio sopra la testa","area":"Passaggio","icon":"⇈","use":"Utilizzare una linea di passaggio alta sopra difensori o pressione.","keys":["Palla sopra la fronte","Gomiti sotto la palla","Spinta di mani e polsi"],"technique":["Le braccia si distendono verso il ricevente.","I polsi e le dita danno direzione.","Un piccolo passo accompagna il passaggio."],"tactics":"Si usa quando la linea libera è sopra la testa o sopra le spalle.","errors":["Portare la palla dietro la testa","Passaggio a parabola lenta","Gomiti troppo aperti"],"exam":"Passaggio sopra la testa: Utilizzare una linea di passaggio alta sopra difensori o pressione. Gli elementi tecnici essenziali sono: Le braccia si distendono verso il ricevente. I polsi e le dita danno direzione. Un piccolo passo accompagna il passaggio. Dal punto di vista tattico, si usa quando la linea libera è sopra la testa o sopra le spalle."},{"id":"pass-laterale","title":"Passaggio laterale a una o due mani","area":"Passaggio","icon":"↝","use":"Aggirare il difensore aprendo una linea laterale.","keys":["Perno ed equilibrio","Palla fuori dalla sagoma difensiva","Polso orientato al bersaglio"],"technique":["Il corpo crea una finestra laterale.","Il braccio distende senza perdere controllo.","Il passo e il passaggio sono coordinati."],"tactics":"Si sceglie quando il difensore chiude la linea centrale ma lascia spazio laterale.","errors":["Sbilanciarsi","Telegrafare la direzione","Palla esposta prima del rilascio"],"exam":"Passaggio laterale a una o due mani: Aggirare il difensore aprendo una linea laterale. Gli elementi tecnici essenziali sono: Il corpo crea una finestra laterale. Il braccio distende senza perdere controllo. Il passo e il passaggio sono coordinati. Dal punto di vista tattico, si sceglie quando il difensore chiude la linea centrale ma lascia spazio laterale."},{"id":"pass-consegnato","title":"Passaggio consegnato","area":"Passaggio","icon":"⇄","use":"Trasferire la palla a un compagno vicino mantenendo protezione e continuità.","keys":["Palla protetta","Compagno passa vicino","Consegna nel tempo corretto"],"technique":["Il portatore presenta la palla sul lato protetto.","Il ricevente entra vicino e prende con due mani.","Corpi e traiettorie limitano l’intervento difensivo."],"tactics":"Può creare un cambio di lato, una penetrazione o una collaborazione simile a un blocco.","errors":["Palla lontana dal corpo","Distanza eccessiva","Consegna senza leggere il difensore"],"exam":"Passaggio consegnato: Trasferire la palla a un compagno vicino mantenendo protezione e continuità. Gli elementi tecnici essenziali sono: Il portatore presenta la palla sul lato protetto. Il ricevente entra vicino e prende con due mani. Corpi e traiettorie limitano l’intervento difensivo. Dal punto di vista tattico, può creare un cambio di lato, una penetrazione o una collaborazione simile a un blocco."},{"id":"pass-baseball","title":"Passaggio baseball","area":"Passaggio","icon":"➶","use":"Coprire una grande distanza con rapidità e precisione.","keys":["Palla vicino alla spalla","Rotazione coordinata del corpo","Traiettoria tesa verso lo spazio"],"technique":["Presa salda con mano di spinta e guida iniziale.","Gambe e tronco producono forza.","Il braccio completa il movimento verso il bersaglio."],"tactics":"Si usa soprattutto per apertura lunga e contropiede.","errors":["Solo forza del braccio","Traiettoria alta e lenta","Bersaglio fermo invece dello spazio"],"exam":"Passaggio baseball: Coprire una grande distanza con rapidità e precisione. Gli elementi tecnici essenziali sono: Presa salda con mano di spinta e guida iniziale. Gambe e tronco producono forza. Il braccio completa il movimento verso il bersaglio. Dal punto di vista tattico, si usa soprattutto per apertura lunga e contropiede."},{"id":"pass-palleggio","title":"Passaggio da palleggio","area":"Passaggio","icon":"➠","use":"Ridurre il tempo tra ultimo palleggio e passaggio, mantenendo il vantaggio.","keys":["Lettura prima della raccolta","Spinta diretta dal palleggio","Precisione con una mano"],"technique":["La mano accompagna la palla dal rimbalzo al passaggio.","Il gesto evita una presa intermedia lenta.","Corpo e piedi restano orientati alla scelta."],"tactics":"Si usa quando il tempo disponibile è minimo e la linea si apre durante il palleggio.","errors":["Fermare inutilmente la palla","Passaggio senza equilibrio","Mano debole non allenata"],"exam":"Passaggio da palleggio: Ridurre il tempo tra ultimo palleggio e passaggio, mantenendo il vantaggio. Gli elementi tecnici essenziali sono: La mano accompagna la palla dal rimbalzo al passaggio. Il gesto evita una presa intermedia lenta. Corpo e piedi restano orientati alla scelta. Dal punto di vista tattico, si usa quando il tempo disponibile è minimo e la linea si apre durante il palleggio."},{"id":"finte","title":"Finte con e senza palla","area":"Attacco","icon":"≈","use":"Provocare una reazione difensiva per aprire spazio o tempo vantaggioso.","keys":["Gesto credibile","Leggere la risposta","Attaccare subito il vantaggio"],"technique":["Occhi, palla, piedi e corpo comunicano un’intenzione.","L’ampiezza è sufficiente a provocare risposta, non eccessiva.","La seconda azione parte senza pausa."],"tactics":"Una finta è utile solo se collegata alla lettura e a un’azione successiva efficace.","errors":["Finta troppo grande","Guardare già la seconda scelta","Nessuna accelerazione dopo la reazione"],"exam":"Finte con e senza palla: Provocare una reazione difensiva per aprire spazio o tempo vantaggioso. Gli elementi tecnici essenziali sono: Occhi, palla, piedi e corpo comunicano un’intenzione. L’ampiezza è sufficiente a provocare risposta, non eccessiva. La seconda azione parte senza pausa. Dal punto di vista tattico, una finta è utile solo se collegata alla lettura e a un’azione successiva efficace."},{"id":"tiro","title":"Tiro","area":"Attacco","icon":"⌁","use":"Concretizzare il vantaggio con una conclusione ad alta percentuale.","keys":["Equilibrio","Allineamento","Continuità e frustata finale"],"technique":["Piedi e corpo in equilibrio.","Mano di tiro sotto la palla, mano guida laterale.","Distensione coordinata e chiusura del polso verso il canestro."],"tactics":"La scelta dipende da spazio, tempo, distanza e posizione del difensore.","errors":["Gomito aperto senza controllo","Mano guida che spinge","Interruzione della catena gambe-braccio-polso"],"exam":"Il tiro è il fondamentale con cui si concretizza il vantaggio. Richiede equilibrio, coordinazione, corretta presa e continuità dalla spinta delle gambe fino alla frustata finale del polso."},{"id":"tiro-fermo","title":"Tiro da fermo","area":"Tiro","icon":"⌂","use":"Concludere in equilibrio senza elevazione significativa.","keys":["Piedi equilibrati","Presa e allineamento","Distensione e frustata"],"technique":["Le gambe iniziano la spinta.","Mano di tiro sotto la palla e guida laterale.","Braccio e polso terminano verso il canestro."],"tactics":"È la base tecnica del tiro e si usa quando tempo e spazio consentono stabilità.","errors":["Spinta solo di braccia","Mano guida attiva","Mancanza di equilibrio"],"exam":"Tiro da fermo: Concludere in equilibrio senza elevazione significativa. Gli elementi tecnici essenziali sono: Le gambe iniziano la spinta. Mano di tiro sotto la palla e guida laterale. Braccio e polso terminano verso il canestro. Dal punto di vista tattico, è la base tecnica del tiro e si usa quando tempo e spazio consentono stabilità."},{"id":"tiro-elevazione","title":"Tiro in elevazione","area":"Tiro","icon":"⇧","use":"Tirare salendo verticalmente per aumentare altezza e protezione del rilascio.","keys":["Salita verticale","Palla pronta durante l’elevazione","Rilascio coordinato"],"technique":["La spinta delle gambe solleva il corpo.","La palla sale nella posizione di tiro.","Il rilascio avviene durante la salita con caduta equilibrata."],"tactics":"Si usa quando serve alzare il punto di rilascio senza perdere continuità.","errors":["Saltare in avanti senza controllo","Palla che sale tardi","Caduta fuori equilibrio"],"exam":"Tiro in elevazione: Tirare salendo verticalmente per aumentare altezza e protezione del rilascio. Gli elementi tecnici essenziali sono: La spinta delle gambe solleva il corpo. La palla sale nella posizione di tiro. Il rilascio avviene durante la salita con caduta equilibrata. Dal punto di vista tattico, si usa quando serve alzare il punto di rilascio senza perdere continuità."},{"id":"tiro-sospensione","title":"Tiro in sospensione","area":"Tiro","icon":"⇡","use":"Creare separazione e rilasciare la palla vicino al punto alto del salto.","keys":["Arresto equilibrato","Elevazione controllata","Rilascio al punto utile"],"technique":["Il corpo sale verticale.","La palla resta allineata alla mano di tiro.","Il gesto si completa prima della ricaduta."],"tactics":"Si utilizza contro una pressione maggiore, scegliendo altezza e tempo rispetto al difensore.","errors":["Rilascio in discesa","Gambe disperse","Forzare senza spazio"],"exam":"Tiro in sospensione: Creare separazione e rilasciare la palla vicino al punto alto del salto. Gli elementi tecnici essenziali sono: Il corpo sale verticale. La palla resta allineata alla mano di tiro. Il gesto si completa prima della ricaduta. Dal punto di vista tattico, si utilizza contro una pressione maggiore, scegliendo altezza e tempo rispetto al difensore."},{"id":"uncino","title":"Tiro ad uncino / semigancio","area":"Tiro","icon":"◔","use":"Concludere vicino a canestro proteggendo la palla dal difensore con il corpo.","keys":["Piede opposto alla mano di tiro verso canestro","Palla lontana dal difensore, vicina all’orecchio","Distensione del braccio e frustata di polso e dita"],"technique":["La mano di tiro passa sotto la palla mentre sale.","La mano guida resta laterale e accompagna fino al rilascio.","La spalla opposta alla mano di tiro è rivolta al petto del difensore.","In chiusura: palmo della mano di tiro verso il suolo, braccia alte e caduta in equilibrio."],"tactics":"Si usa vicino a canestro quando occorre tirare tenendo la palla lontana dal difensore.","errors":["Portare la palla davanti al difensore","Non usare il corpo come protezione","Cadere all’indietro o fuori equilibrio"],"exam":"Il tiro ad uncino, chiamato spesso semigancio, è una conclusione ravvicinata che protegge la palla con il corpo. Si avanza con il piede opposto alla mano di tiro, portando la palla vicino all’orecchio e lontano dal difensore. La mano passa sotto la palla, il braccio si distende e il gesto termina con la frustata del polso e delle dita. La mano guida accompagna fino al rilascio e la caduta deve essere equilibrata."},{"id":"terzo-tempo","title":"Tiro in corsa: terzo tempo","area":"Tiro in corsa","icon":"①","use":"Concludere al ferro trasformando la corsa in due appoggi e salto.","keys":["Raccolta nel tempo corretto","Due appoggi coordinati","Salto sul piede opposto alla mano"],"technique":["La palla viene raccolta prima dei due appoggi consentiti.","Il ginocchio libero sale proteggendo il gesto.","La mano accompagna la palla al tabellone o al canestro."],"tactics":"Si usa dopo aver creato vantaggio e raggiunto lo spazio vicino al ferro.","errors":["Passi irregolari","Palla bassa durante gli appoggi","Salto senza equilibrio"],"exam":"Tiro in corsa: terzo tempo: Concludere al ferro trasformando la corsa in due appoggi e salto. Gli elementi tecnici essenziali sono: La palla viene raccolta prima dei due appoggi consentiti. Il ginocchio libero sale proteggendo il gesto. La mano accompagna la palla al tabellone o al canestro. Dal punto di vista tattico, si usa dopo aver creato vantaggio e raggiunto lo spazio vicino al ferro."},{"id":"secondo-tempo","title":"Tiro in corsa: secondo tempo","area":"Tiro in corsa","icon":"②","use":"Concludere rapidamente utilizzando un solo appoggio dopo la raccolta.","keys":["Raccolta anticipata","Un appoggio forte","Rilascio rapido e protetto"],"technique":["La palla è controllata prima dell’ultimo appoggio.","Il corpo converte velocità orizzontale in elevazione.","Il rilascio si adatta alla posizione del difensore."],"tactics":"Riduce i tempi e può sorprendere l’aiuto difensivo.","errors":["Raccolta tardiva","Perdita di controllo","Tiro lontano dal corpo"],"exam":"Tiro in corsa: secondo tempo: Concludere rapidamente utilizzando un solo appoggio dopo la raccolta. Gli elementi tecnici essenziali sono: La palla è controllata prima dell’ultimo appoggio. Il corpo converte velocità orizzontale in elevazione. Il rilascio si adatta alla posizione del difensore. Dal punto di vista tattico, riduce i tempi e può sorprendere l’aiuto difensivo."},{"id":"postulati","title":"Postulati: spazio, tempo, equilibrio, autonomia","area":"Concetti","icon":"✦","use":"Leggere il gioco attraverso i riferimenti fondamentali che guidano tecnica e decisioni.","keys":["Spazio utile","Tempo corretto","Equilibrio e autonomia"],"technique":["Ogni gesto tecnico è adattato allo spazio disponibile.","La scelta deve avvenire nel tempo che il gioco concede.","Equilibrio permette di eseguire e autonomia permette di decidere."],"tactics":"I postulati collegano fondamentali tecnici e tattici: guardare, parlare, ascoltare e toccare.","errors":["Insegnare gesti senza situazione","Ignorare tempo e distanza","Dare soluzioni senza responsabilità al giocatore"],"exam":"Postulati: spazio, tempo, equilibrio, autonomia: Leggere il gioco attraverso i riferimenti fondamentali che guidano tecnica e decisioni. Gli elementi tecnici essenziali sono: Ogni gesto tecnico è adattato allo spazio disponibile. La scelta deve avvenire nel tempo che il gioco concede. Equilibrio permette di eseguire e autonomia permette di decidere. Dal punto di vista tattico, i postulati collegano fondamentali tecnici e tattici: guardare, parlare, ascoltare e toccare."},{"id":"vantaggio","title":"Creare, mantenere e concretizzare il vantaggio","area":"Concetti","icon":"＋","use":"Organizzare ogni azione offensiva e difensiva attorno al vantaggio.","keys":["Creare spazio o tempo","Mantenere con scelta e collaborazione","Concretizzare con tiro ad alta percentuale"],"technique":["Il vantaggio nasce quando un difensore è battuto o impegnato.","Passaggio, palleggio e movimento mantengono il vantaggio.","La conclusione corretta lo trasforma in un risultato."],"tactics":"In difesa l’obiettivo opposto è togliere il vantaggio, recuperare la palla o forzare un tiro difficile.","errors":["Confondere velocità con vantaggio","Fermare la palla","Concludere senza equilibrio"],"exam":"Creare, mantenere e concretizzare il vantaggio: Organizzare ogni azione offensiva e difensiva attorno al vantaggio. Gli elementi tecnici essenziali sono: Il vantaggio nasce quando un difensore è battuto o impegnato. Passaggio, palleggio e movimento mantengono il vantaggio. La conclusione corretta lo trasforma in un risultato. Dal punto di vista tattico, in difesa l’obiettivo opposto è togliere il vantaggio, recuperare la palla o forzare un tiro difficile."},{"id":"progressione","title":"Progressione didattica","area":"Metodologia","icon":"▤","use":"Portare il giocatore dal gesto semplice alla lettura e al gioco reale.","keys":["Dal semplice al complesso","Dall’1c0 alla presenza difensiva","Trasferimento in situazione agonistica"],"technique":["Si definisce un obiettivo osservabile.","Si costruiscono esercizi coerenti e progressivi.","Regole e difficoltà aumentano senza perdere l’obiettivo."],"tactics":"La progressione efficace comprende attivazione, fase cognitiva e agonistica, correzione e verifica.","errors":["Esercizi scollegati","Troppe correzioni insieme","Regole che cambiano l’obiettivo"],"exam":"Progressione didattica: Portare il giocatore dal gesto semplice alla lettura e al gioco reale. Gli elementi tecnici essenziali sono: Si definisce un obiettivo osservabile. Si costruiscono esercizi coerenti e progressivi. Regole e difficoltà aumentano senza perdere l’obiettivo. Dal punto di vista tattico, la progressione efficace comprende attivazione, fase cognitiva e agonistica, correzione e verifica."},{"id":"osservazione","title":"Osservazione e correzione","area":"Metodologia","icon":"◎","use":"Vedere ciò che accade realmente e intervenire sull’errore prioritario.","keys":["Osservare rispetto all’obiettivo","Scegliere cosa correggere","Verificare l’effetto della correzione"],"technique":["L’allenatore definisce indicatori concreti.","Può correggere direttamente o porre domande.","Lascia tempo al giocatore per adattare la risposta."],"tactics":"La correzione deve far crescere il singolo e la squadra, senza interrompere inutilmente il gioco.","errors":["Correggere tutto","Osservare la palla soltanto","Dare soluzioni senza domande"],"exam":"Osservazione e correzione: Vedere ciò che accade realmente e intervenire sull’errore prioritario. Gli elementi tecnici essenziali sono: L’allenatore definisce indicatori concreti. Può correggere direttamente o porre domande. Lascia tempo al giocatore per adattare la risposta. Dal punto di vista tattico, la correzione deve far crescere il singolo e la squadra, senza interrompere inutilmente il gioco."}],"sections":["Fondamentali senza palla","Fondamentali difensivi","Fondamentali offensivi con palla","Concetti e metodo"],"diagrams":[{"title":"Passa e taglia","players":[["1",24,78,true],["2",76,35,false]],"arrows":[["pass",30,66,48,-26],["move",32,69,42,-64]],"steps":["1 passa la palla a 2 sul lato.","Subito dopo 1 taglia deciso verso canestro.","2 legge: passa sul taglio oppure mantiene il vantaggio."]},{"title":"Taglio back-door","players":[["1",25,58,true],["2",73,45,false]],"arrows":[["move",70,49,38,132],["pass",30,56,46,12]],"steps":["2 finta di venire incontro.","Quando il difensore anticipa, 2 taglia dietro verso canestro.","1 passa nello spazio davanti al taglio."]},{"title":"Dai e vai","players":[["1",22,72,true],["2",72,42,false]],"arrows":[["pass",28,66,48,-24],["move",32,67,46,-58]],"steps":["1 passa a 2.","1 accelera nello spazio interno.","2 restituisce nel tempo utile per la conclusione."]},{"title":"Penetra e scarica","players":[["1",28,76,true],["2",78,48,false]],"arrows":[["move",34,69,34,-60],["pass",47,43,33,10]],"steps":["1 batte il proprio difensore in palleggio.","La difesa aiuta sulla penetrazione.","1 scarica a 2 rimas
