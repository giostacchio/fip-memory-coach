<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102738"><title>FIP Memory Coach</title><style>:root{--ink:#10202d;--navy:#102738;--blue:#155f81;--cyan:#32c6d4;--paper:#f4f1e9;--orange:#f4653f;--line:#d8d7cf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}.topbar{height:78px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));border-bottom:4px solid var(--cyan)}.brand{display:flex;align-items:center;gap:12px}.brand b{letter-spacing:.11em}.brand small{display:block;color:#a9c0cb;margin-top:3px}.ball{font-size:30px;color:var(--orange);border:2px solid #fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}.level{font-size:11px;letter-spacing:.1em;color:#a9c0cb}.level b{color:#fff;background:var(--blue);font-size:17px;padding:8px 12px;border-radius:50%;margin-left:8px}.tabs{background:#fff;display:flex;justify-content:center;gap:8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.tabs button{border:0;background:none;padding:18px 22px;color:#64737d;font-weight:700;border-bottom:3px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--orange)}.page{max-width:1180px;margin:auto;padding:38px 22px 60px}.hero{background:var(--navy);color:#fff;border-radius:26px;padding:46px 54px;display:grid;grid-template-columns:1.5fr 1fr;gap:30px;min-height:330px;overflow:hidden}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--orange)}h1{font-size:46px;line-height:1.05;margin:13px 0 16px;letter-spacing:-.04em}h1 em{color:var(--cyan);font-style:normal}.hero p,.pagehead p{font-size:17px;line-height:1.6;max-width:620px;color:#bdd0d9}.primary,.recall button{border:0;background:var(--orange);color:#fff;padding:13px 20px;border-radius:10px;font-weight:800}.court-mini{position:relative;min-height:230px;border:2px solid #356070;border-radius:18px;background:linear-gradient(90deg,transparent 49%,#356070 50%,transparent 51%);display:flex;flex-direction:column;align-items:center;justify-content:center}.court-mini:after{content:"";position:absolute;width:100px;height:100px;border:2px solid #356070;border-radius:50%}.court-mini b{font-size:48px;z-index:2}.court-mini small{z-index:2;color:#a9c0cb}.hoop{position:absolute;top:15px;color:var(--orange)}.player{position:absolute;background:var(--cyan);color:var(--navy);font-weight:bold;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}.p1{left:18%;bottom:20%}.p2{right:18%;top:23%}.route{position:absolute;font-size:60px;color:var(--orange);transform:rotate(-20deg)}.statrow{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:18px;margin-top:22px;border:1px solid var(--line)}.statrow article{padding:24px 28px;border-right:1px solid var(--line)}.statrow article:last-child{border:0}.statrow span{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:#71808a}.statrow b{font-size:34px}.statrow small{font-size:16px;color:#8b969c}.section-title{margin:38px 0 16px}.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.review-card{border:1px solid var(--line);background:#fff;border-radius:16px;text-align:left;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;color:inherit}.review-card:hover{border-color:var(--blue);transform:translateY(-2px)}.num{font-size:11px;color:#9aa4aa}.topic-icon{font-size:28px;color:var(--blue)}.review-card small,.topic-list small{display:block;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);font-size:9px;font-weight:bold}.review-card b{display:block;margin:4px 0}.review-card p{margin:0;color:#75828a;font-size:12px}.go{font-size:22px;color:var(--orange)}.done{grid-column:1/-1;background:#dff5ef;padding:24px;border-radius:15px}.split{display:grid;grid-template-columns:300px 1fr;gap:26px}.topic-list{background:var(--navy);border-radius:20px;padding:26px;color:#fff;align-self:start}.topic-list h2{font-size:28px;margin:7px 0 20px}.topic-list button{display:grid;grid-template-columns:34px 1fr auto;width:100%;text-align:left;background:transparent;color:#c7d5db;border:0;border-top:1px solid #294553;padding:15px 8px;align-items:center}.topic-list button.active{color:#fff;background:#1a3b4c;border-radius:9px;padding-left:12px}.topic-list i{color:var(--cyan)}.lesson{background:#fff;border:1px solid var(--line);border-radius:20px;padding:38px}.lesson-head{display:flex;justify-content:space-between;gap:20px}.lesson h1{font-size:38px}.known{align-self:start;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px}.known.active{background:#dff5ef;color:#16634e;border-color:#a2d7c8}.purpose{border-left:5px solid var(--orange);background:#fff5ee;padding:18px 22px;margin:10px 0 28px}.purpose p{margin:6px 0 0;line-height:1.5}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys div{background:var(--paper);padding:18px;border-radius:12px}.keys span{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:bold}.keys p{font-weight:bold;line-height:1.4}.recall{margin:28px 0;background:var(--navy);color:#fff;padding:28px;border-radius:16px}.recall h3{font-size:24px;margin:8px 0}.recall p{color:#b8cbd4}.exam-answer{border-top:1px solid #365465;margin-top:20px;padding-top:20px;line-height:1.7;color:#e7f0f3}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:34px}.two-col li,.two-col p{line-height:1.6;margin-bottom:8px}.errors li::marker{color:var(--orange)}.pagehead{background:var(--navy);color:#fff;border-radius:20px;padding:34px 40px;margin-bottom:24px}.pagehead h1{margin-bottom:7px}.diagram-layout{display:grid;grid-template-columns:1.15fr 1fr;gap:24px}.court{min-height:540px;background:#e8b77b;border:4px solid #fff;box-shadow:0 0 0 1px #bb8956;position:relative;border-radius:5px;overflow:hidden}.court:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid #fff}.court:after{content:"";position:absolute;width:150px;height:150px;border:3px solid #fff;border-radius:50%;left:calc(50% - 75px);top:calc(50% - 75px)}.paint{position:absolute;top:0;left:calc(50% - 75px);width:150px;height:150px;border:3px solid #fff}.circle{position:absolute;top:73px;left:calc(50% - 75px);width:150px;height:150px;border:3px solid #fff;border-radius:50%}.basket{position:absolute;top:25px;left:calc(50% - 13px);font-size:28px;color:var(--orange)}.d-player{position:absolute;background:var(--blue);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:20px;z-index:2}.d-player small{color:var(--orange);position:absolute;right:-12px}.one{bottom:16%;left:28%}.two{top:30%;right:25%}.pass-arrow{position:absolute;bottom:34%;left:32%;font-size:30px;transform:rotate(-36deg);color:var(--navy)}.cut-arrow{position:absolute;top:38%;left:38%;font-size:64px;transform:rotate(-40deg);color:var(--orange)}.steps{display:flex;flex-direction:column;gap:12px}.steps article{display:grid;grid-template-columns:50px 1fr;gap:15px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.steps article>span{font-size:12px;color:var(--orange);font-weight:bold}.steps h3{margin:0 0 6px}.steps p{margin:0;color:#64737d;line-height:1.5}.challenge{background:var(--navy);color:#fff;border-radius:14px;padding:22px}.challenge p{line-height:1.6;color:#c5d6dd}.exam-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.exam-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.exam-card.featured{grid-row:span 2}.exam-label{font-size:10px;letter-spacing:.14em;font-weight:bold;color:var(--orange)}.timer{font-size:48px;font-weight:800;color:var(--blue);margin-top:15px}.exam-card h2{font-size:24px}.exam-card p,.exam-card li{line-height:1.6;color:#53636c}.exam-card textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:10px;padding:14px;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px}.actions button:not(.primary),.outline{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px;font-weight:bold}.answers{display:grid;gap:8px}.answers button{text-align:left;border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:13px}.answers button.correct{background:#dff5ef;border-color:#52ad91}.answers button.wrong{background:#ffe5df;border-color:var(--orange)}.quiz-result{display:flex;align-items:center;gap:12px;margin-top:14px}.quiz-result span{color:#64737d}.quiz-result button{margin-left:auto;border:0;background:var(--blue);color:#fff;padding:9px 12px;border-radius:8px}.commission{background:#fff1e9;border-left:4px solid var(--orange);padding:14px;margin-top:16px;line-height:1.5}footer{text-align:center;padding:25px;background:var(--navy);color:#9cb3bd;font-size:12px}.topic-list{max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:76px}.topic-search{width:100%;border:1px solid #416071;background:#0d202d;color:#fff;border-radius:9px;padding:11px 12px;margin:0 0 12px;outline:none}.topic-search::placeholder{color:#8ea5af}.topic-search:focus{border-color:var(--cyan)}@media(max-width:800px){.topbar{padding:0 16px}.level{display:none}.tabs{justify-content:flex-start;overflow:auto}.tabs button{white-space:nowrap;padding:15px 14px}.page{padding:22px 14px 45px}.hero{grid-template-columns:1fr;padding:30px 24px}.hero h1,h1{font-size:36px}.court-mini{min-height:190px}.statrow{grid-template-columns:1fr 1fr}.statrow article:last-child{grid-column:1/-1;border-top:1px solid var(--line)}.review-grid,.keys{grid-template-columns:1fr}.split,.diagram-layout,.exam-grid{grid-template-columns:1fr}.topic-list{padding:20px;max-height:none;position:static}.topic-list h2{margin-bottom:8px}.topic-list button{padding:11px 8px}.lesson{padding:24px 18px}.lesson-head{display:block}.known{margin-bottom:14px}.two-col{grid-template-columns:1fr}.court{min-height:430px}.pagehead{padding:28px 24px}.pagehead h1{font-size:34px}.exam-card.featured{grid-row:auto}.brand b{font-size:13px}.brand small{font-size:10px}}</style></head><body>
<main id="app"></main><script>
const topics=[{"id": "uncino", "title": "Tiro ad uncino / semigancio", "area": "Tiro", "icon": "◔", "use": "Concludere vicino a canestro proteggendo la palla dal difensore con il corpo.", "keys": ["Piede opposto alla mano di tiro verso canestro", "Palla lontana dal difensore, vicina all’orecchio", "Distensione del braccio e frustata di polso e dita"], "technique": ["La mano di tiro passa sotto la palla mentre sale.", "La mano guida resta laterale e accompagna fino al rilascio.", "La spalla opposta alla mano di tiro è rivolta al petto del difensore.", "In chiusura: palmo della mano di tiro verso il suolo, braccia alte e caduta in equilibrio."], "tactics": "Si usa vicino a canestro quando occorre tirare tenendo la palla lontana dal difensore.", "errors": ["Portare la palla davanti al difensore", "Non usare il corpo come protezione", "Cadere all’indietro o fuori equilibrio"], "exam": "Il tiro ad uncino, chiamato spesso semigancio, è una conclusione ravvicinata che protegge la palla con il corpo. Si avanza con il piede opposto alla mano di tiro, portando la palla vicino all’orecchio e lontano dal difensore. La mano passa sotto la palla, il braccio si distende e il gesto termina con la frustata del polso e delle dita. La mano guida accompagna fino al rilascio e la caduta deve essere equilibrata."}, {"id": "palleggio", "title": "Palleggio", "area": "Attacco", "icon": "●", "use": "Spostarsi con la palla, creare vantaggio e migliorare una linea di passaggio.", "keys": ["Spinta con polso e dita", "Testa alta e visione del gioco", "Palla protetta e controllo del corpo"], "technique": ["Mano sopra e leggermente dietro la palla.", "Spinta elastica con polso e dita, senza schiaffeggiare.", "Altezza e distanza cambiano secondo velocità, spazio e difensore."], "tactics": "Il palleggio è un mezzo, non il fine: serve a creare vantaggio o risolvere una situazione.", "errors": ["Guardare continuamente la palla", "Palleggiare senza obiettivo", "Palla esposta al difensore"], "exam": "Il palleggio permette di muoversi con la palla. Tecnicamente si controlla con polso e dita, mantenendo equilibrio e visione del gioco. Tatticamente deve avere uno scopo: creare vantaggio, superare pressione o aprire una linea di passaggio."}, {"id": "cambio", "title": "Cambio frontale incrociato e omologo", "area": "Palleggio", "icon": "↔", "use": "Cambiare direzione leggendo spazio e distanza dal difensore.", "keys": ["Cambio basso sotto le ginocchia", "Avviene prima dell’ostacolo o difensore", "Accelerazione immediata dopo il cambio"], "technique": ["Incrociato: il piede opposto alla nuova mano attacca lo spazio.", "Omologo: il piede dello stesso lato della nuova mano anticipa l’uscita.", "La mano passa da sopra a sopra-laterale della palla."], "tactics": "Difensore vicino: privilegiare l’incrociato. Spazio maggiore o difensore lontano: l’omologo consente di anticipare l’uscita.", "errors": ["Cambio troppo alto", "Cambio eseguito sotto o dopo il difensore", "Nessuna accelerazione in uscita"], "exam": "Il cambio di mano frontale permette di cambiare direzione davanti al corpo. Si prepara con palleggio controllato, si esegue basso e prima del difensore, quindi si accelera. La scelta tra incrociato e omologo dipende soprattutto dalla distanza e dallo spazio disponibile."}, {"id": "passaggio", "title": "Passaggio", "area": "Attacco", "icon": "⇢", "use": "Far arrivare la palla al punto giusto nel momento giusto e mantenere il vantaggio.", "keys": ["Leggere la linea aperta", "Precisione e tempo corretto", "Collaborazione tra passatore e ricevente"], "technique": ["Equilibrio e presa sicura.", "Spinta coordinata di gambe, braccia, polsi e dita.", "Il tipo di passaggio dipende dalla linea disponibile."], "tactics": "Petto, schiacciato, sopra la testa, laterale, baseball, consegnato o da palleggio si scelgono leggendo spazio e difesa.", "errors": ["Passaggio lento o telefonato", "Non guardare il difensore", "Ricevente fermo senza mostrare un bersaglio"], "exam": "Il passaggio serve a mantenere il vantaggio facendo arrivare la palla al punto giusto nel momento giusto. Tecnica e scelta non sono separate: il giocatore usa il passaggio adatto alla linea lasciata libera dalla difesa."}, {"id": "tiro", "title": "Tiro", "area": "Attacco", "icon": "⌁", "use": "Concretizzare il vantaggio con una conclusione ad alta percentuale.", "keys": ["Equilibrio", "Allineamento", "Continuità e frustata finale"], "technique": ["Piedi e corpo in equilibrio.", "Mano di tiro sotto la palla, mano guida laterale.", "Distensione coordinata e chiusura del polso verso il canestro."], "tactics": "La scelta dipende da spazio, tempo, distanza e posizione del difensore.", "errors": ["Gomito aperto senza controllo", "Mano guida che spinge", "Interruzione della catena gambe-braccio-polso"], "exam": "Il tiro è il fondamentale con cui si concretizza il vantaggio. Richiede equilibrio, coordinazione, corretta presa e continuità dalla spinta delle gambe fino alla frustata finale del polso."}, {"id": "difesa", "title": "Posizione e difesa sulla palla", "area": "Difesa", "icon": "◇", "use": "Contenere l’attaccante, togliere spazio utile e recuperare la palla.", "keys": ["Equilibrio e reattività", "Distanza adeguata", "Petto davanti alla palla"], "technique": ["Piedi attivi, base stabile e busto pronto.", "Scivolare senza incrociare i piedi quando possibile.", "Mani attive coerenti con palla e linee di passaggio."], "tactics": "La distanza cambia secondo capacità dell’attaccante, posizione della palla e spazio da proteggere.", "errors": ["Peso sui talloni", "Piedi che si uniscono", "Cercare la palla perdendo posizione"], "exam": "La difesa sulla palla nasce dalla posizione fondamentale e dalla distanza. Il difensore deve rimanere equilibrato, orientare l’attaccante e mantenere il petto davanti alla palla, usando piedi e mani in modo coordinato."}, {"id": "posizione-off", "title": "Posizione fondamentale offensiva", "area": "Senza palla", "icon": "△", "use": "Preparare ogni movimento offensivo mantenendo equilibrio e possibilità di scelta.", "keys": ["Piedi alla larghezza delle spalle", "Gambe piegate e peso sull’avampiede", "Testa alta e corpo pronto"], "technique": ["Base stabile ma non rigida.", "Ginocchia e caviglie piegate.", "Tronco leggermente inclinato e mani pronte."], "tactics": "È la posizione di partenza per ricevere, passare, tirare, partire o cambiare direzione.", "errors": ["Gambe tese", "Peso sui talloni", "Sguardo basso"], "exam": "Posizione fondamentale offensiva: Preparare ogni movimento offensivo mantenendo equilibrio e possibilità di scelta. Gli elementi tecnici essenziali sono: Base stabile ma non rigida. Ginocchia e caviglie piegate. Tronco leggermente inclinato e mani pronte. Dal punto di vista tattico, è la posizione di partenza per ricevere, passare, tirare, partire o cambiare direzione."}, {"id": "presa", "title": "Presa e ricezione della palla", "area": "Attacco", "icon": "◉", "use": "Controllare immediatamente la palla ed essere pronti alla scelta successiva.", "keys": ["Mani pronte e bersaglio", "Ammortizzare la ricezione", "Palla protetta e visione"], "technique": ["Dita aperte e pollici orientati secondo la traiettoria.", "Le braccia accompagnano la palla verso il corpo.", "Dopo la presa si recuperano equilibrio e posizione fondamentale."], "tactics": "La ricezione deve avvenire nel tempo e nello spazio utili, già orientati verso il gioco.", "errors": ["Aspettare la palla con mani basse", "Corpo rigido", "Guardare solo la palla"], "exam": "Presa e ricezione della palla: Controllare immediatamente la palla ed essere pronti alla scelta successiva. Gli elementi tecnici essenziali sono: Dita aperte e pollici orientati secondo la traiettoria. Le braccia accompagnano la palla verso il corpo. Dopo la presa si recuperano equilibrio e posizione fondamentale. Dal punto di vista tattico, la ricezione deve avvenire nel tempo e nello spazio utili, già orientati verso il gioco."}, {"id": "arresto-uno", "title": "Arresto ad un tempo", "area": "Senza palla", "icon": "▣", "use": "Fermare il movimento atterrando contemporaneamente sui due piedi.", "keys": ["Stacco controllato", "Appoggio simultaneo", "Equilibrio e libertà di perno"], "technique": ["Breve fase di volo.", "I piedi arrivano contemporaneamente a terra.", "Caviglie, ginocchia e anche ammortizzano l’impatto."], "tactics": "Consente di scegliere il piede perno e risulta utile quando serve equilibrio immediato.", "errors": ["Atterrare rigidi", "Piedi troppo stretti", "Perdere il controllo in avanti"], "exam": "Arresto ad un tempo: Fermare il movimento atterrando contemporaneamente sui due piedi. Gli elementi tecnici essenziali sono: Breve fase di volo. I piedi arrivano contemporaneamente a terra. Caviglie, ginocchia e anche ammortizzano l’impatto. Dal punto di vista tattico, consente di scegliere il piede perno e risulta utile quando serve equilibrio immediato."}, {"id": "arresto-due", "title": "Arresto a due tempi", "area": "Senza palla", "icon": "Ⅱ", "use": "Fermare la corsa con due appoggi successivi e controllati.", "keys": ["Primo appoggio frena", "Secondo appoggio equilibra", "Il primo piede diventa perno"], "technique": ["Gli appoggi avvengono in successione.", "Il baricentro si abbassa durante la frenata.", "Il corpo termina stabile e orientato."], "tactics": "Si usa per adattare l’arresto a traiettoria, velocità e spazio disponibile.", "errors": ["Appoggi troppo lunghi", "Baricentro alto", "Confondere il piede perno"], "exam": "Arresto a due tempi: Fermare la corsa con due appoggi successivi e controllati. Gli elementi tecnici essenziali sono: Gli appoggi avvengono in successione. Il baricentro si abbassa durante la frenata. Il corpo termina stabile e orientato. Dal punto di vista tattico, si usa per adattare l’arresto a traiettoria, velocità e spazio disponibile."}, {"id": "perno", "title": "Piede perno e giro", "area": "Senza palla", "icon": "↻", "use": "Proteggere la palla e cambiare orientamento senza commettere passi.", "keys": ["Perno stabile", "Passi brevi con il piede libero", "Palla protetta e testa alta"], "technique": ["Il piede perno mantiene il contatto con il terreno.", "Il corpo ruota in equilibrio.", "La palla resta lontana dalla pressione difensiva."], "tactics": "Serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso.", "errors": ["Spostare il perno", "Ruotare senza vedere il campo", "Esporre la palla"], "exam": "Piede perno e giro: Proteggere la palla e cambiare orientamento senza commettere passi. Gli elementi tecnici essenziali sono: Il piede perno mantiene il contatto con il terreno. Il corpo ruota in equilibrio. La palla resta lontana dalla pressione difensiva. Dal punto di vista tattico, serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso."}, {"id": "partenza-inc", "title": "Partenza incrociata", "area": "Partenze", "icon": "⤢", "use": "Battere il difensore attaccando lo spazio con il piede opposto alla direzione.", "keys": ["Palla e piede partono insieme", "Passo incrociato oltre il difensore", "Spalla bassa e accelerazione"], "technique": ["Il piede opposto incrocia davanti al corpo.", "La palla viene messa a terra prima che il perno si sollevi.", "Il primo passo conquista spazio utile."], "tactics": "È efficace quando il difensore è vicino e occorre proteggere la palla con il corpo.", "errors": ["Alzare il perno prima del palleggio", "Primo passo laterale", "Palla esposta"], "exam": "Partenza incrociata: Battere il difensore attaccando lo spazio con il piede opposto alla direzione. Gli elementi tecnici essenziali sono: Il piede opposto incrocia davanti al corpo. La palla viene messa a terra prima che il perno si sollevi. Il primo passo conquista spazio utile. Dal punto di vista tattico, è efficace quando il difensore è vicino e occorre proteggere la palla con il corpo."}, {"id": "partenza-omo", "title": "Partenza omologa", "area": "Partenze", "icon": "⤡", "use": "Attaccare rapidamente lo spazio sullo stesso lato del piede di partenza.", "keys": ["Piede omologo nella direzione", "Palla a terra nel tempo corretto", "Accelerazione nello spazio"], "technique": ["Il piede dello stesso lato apre la traiettoria.", "Il palleggio precede il distacco del piede perno.", "Corpo e palla avanzano protetti."], "tactics": "Si privilegia quando lo spazio è maggiore e la pressione del difensore consente l’uscita diretta.", "errors": ["Infrazione di passi", "Passo corto senza vantaggio", "Nessun cambio di velocità"], "exam": "Partenza omologa: Attaccare rapidamente lo spazio sullo stesso lato del piede di partenza. Gli elementi tecnici essenziali sono: Il piede dello stesso lato apre la traiettoria. Il palleggio precede il distacco del piede perno. Corpo e palla avanzano protetti. Dal punto di vista tattico, si privilegia quando lo spazio è maggiore e la pressione del difensore consente l’uscita diretta."}, {"id": "palleggio-protetto", "title": "Palleggio protetto", "area": "Palleggio", "icon": "◐", "use": "Mantenere il possesso quando il difensore esercita pressione.", "keys": ["Palla lontana dal difensore", "Altezza del ginocchio", "Corpo e braccio libero proteggono"], "technique": ["Posizione fondamentale bassa.", "Palleggio laterale e controllato.", "Mano sopra-laterale e contatto breve con la palla."], "tactics": "Si usa sotto pressione, senza perdere la visione delle linee di passaggio.", "errors": ["Palleggio alto", "Palla davanti ai piedi", "Spingere il difensore col braccio"], "exam": "Palleggio protetto: Mantenere il possesso quando il difensore esercita pressione. Gli elementi tecnici essenziali sono: Posizione fondamentale bassa. Palleggio laterale e controllato. Mano sopra-laterale e contatto breve con la palla. Dal punto di vista tattico, si usa sotto pressione, senza perdere la visione delle linee di passaggio."}, {"id": "palleggio-spinto", "title": "Palleggio spinto", "area": "Palleggio", "icon": "➤", "use": "Percorrere spazio in velocità mantenendo controllo e visione.", "keys": ["Palla spinta avanti", "Altezza circa alla cintola", "Corsa e palleggio coordinati"], "technique": ["La mano lavora dietro e sopra la palla.", "Il rimbalzo è davanti al corpo.", "La frequenza si adatta alla velocità di corsa."], "tactics": "Si usa in campo aperto, contropiede o quando non c’è pressione ravvicinata.", "errors": ["Palla troppo vicina ai piedi", "Guardare in basso", "Spingere la palla troppo lontano"], "exam": "Palleggio spinto: Percorrere spazio in velocità mantenendo controllo e visione. Gli elementi tecnici essenziali sono: La mano lavora dietro e sopra la palla. Il rimbalzo è davanti al corpo. La frequenza si adatta alla velocità di corsa. Dal punto di vista tattico, si usa in campo aperto, contropiede o quando non c’è pressione ravvicinata."}, {"id": "palleggio-alternato", "title": "Palleggio spinto alternato", "area": "Palleggio", "icon": "⇆", "use": "Avanzare rapidamente alternando le mani secondo traiettoria e pressione.", "keys": ["Cambio continuo di mano", "Palla davanti al corpo", "Ritmo coordinato con la corsa"], "technique": ["Ogni spinta manda la palla verso la mano opposta.", "Il busto resta orientato in avanti.", "La palla viene controllata all’altezza utile alla velocità."], "tactics": "Offre velocità e adattamento in spazi aperti, leggendo eventuali difensori.", "errors": ["Cambio troppo largo", "Perdita del ritmo", "Sguardo sulla palla"], "exam": "Palleggio spinto alternato: Avanzare rapidamente alternando le mani secondo traiettoria e pressione. Gli elementi tecnici essenziali sono: Ogni spinta manda la palla verso la mano opposta. Il busto resta orientato in avanti. La palla viene controllata all’altezza utile alla velocità. Dal punto di vista tattico, offre velocità e adattamento in spazi aperti, leggendo eventuali difensori."}, {"id": "cambio-velocita", "title": "Cambio di velocità in palleggio", "area": "Palleggio", "icon": "⚡", "use": "Creare vantaggio modificando improvvisamente ritmo e velocità.", "keys": ["Rallentamento credibile", "Lettura della reazione", "Ripartenza esplosiva"], "technique": ["Il palleggio rallenta e può alzarsi leggermente.", "Il corpo simula una pausa o un arresto.", "La ripartenza avviene con passo lungo e palleggio spinto."], "tactics": "Serve a sbilanciare un difensore che sta controllando la stessa velocità.", "errors": ["Rallentamento assente", "Ripartenza senza accelerazione", "Perdere protezione"], "exam": "Cambio di velocità in palleggio: Creare vantaggio modificando improvvisamente ritmo e velocità. Gli elementi tecnici essenziali sono: Il palleggio rallenta e può alzarsi leggermente. Il corpo simula una pausa o un arresto. La ripartenza avviene con passo lungo e palleggio spinto. Dal punto di vista tattico, serve a sbilanciare un difensore che sta controllando la stessa velocità."}, {"id": "dietro-schiena", "title": "Cambio di mano dietro schiena", "area": "Palleggio", "icon": "↩", "use": "Cambiare direzione proteggendo la palla quando il difensore occupa lo spazio frontale.", "keys": ["Palla spinta dietro il corpo", "Ricezione con mano opposta", "Cambio di direzione e velocità"], "technique": ["Il palleggio parte lateralmente e passa dietro il bacino.", "La mano opposta riceve senza cercare la palla.", "Piedi e busto preparano la nuova direzione."], "tactics": "Si usa quando lo spazio davanti è chiuso e portare la palla frontalmente sarebbe rischioso.", "errors": ["Palla troppo lontana", "Cambio dietro i talloni", "Nessuna uscita in velocità"], "exam": "Cambio di mano dietro schiena: Cambiare direzione proteggendo la palla quando il difensore occupa lo spazio frontale. Gli elementi tecnici essenziali sono: Il palleggio parte lateralmente e passa dietro il bacino. La mano opposta riceve senza cercare la palla. Piedi e busto preparano la nuova direzione. Dal punto di vista tattico, si usa quando lo spazio davanti è chiuso e portare la palla frontalmente sarebbe rischioso."}, {"id": "sotto-gambe", "title": "Cambio di mano sotto le gambe", "area": "Palleggio", "icon": "⌁", "use": "Cambiare direzione mantenendo la palla protetta nello spazio tra le gambe.", "keys": ["Gambe sfalsate e piegate", "Palla bassa sotto il corpo", "Ricezione e spinta opposta"], "technique": ["Una gamba avanza creando il canale.", "La palla attraversa sotto il bacino.", "Il peso si trasferisce verso la nuova direzione."], "tactics": "È utile sotto pressione perché il corpo protegge la traiettoria della palla.", "errors": ["Gambe rigide", "Rimbalzo troppo alto", "Palla che colpisce il piede"], "exam": "Cambio di mano sotto le gambe: Cambiare direzione mantenendo la palla protetta nello spazio tra le gambe. Gli elementi tecnici essenziali sono: Una gamba avanza creando il canale. La palla attraversa sotto il bacino. Il peso si trasferisce verso la nuova direzione. Dal punto di vista tattico, è utile sotto pressione perché il corpo protegge la traiettoria della palla."}, {"id": "virata", "title": "Giro in palleggio o virata", "area": "Palleggio", "icon": "⟳", "use": "Superare una pressione ravvicinata ruotando e proteggendo la palla.", "keys": ["Arresto controllato", "Perno e dorso al difensore", "Uscita con mano opposta"], "technique": ["Si appoggia il piede interno come perno.", "Il corpo ruota proteggendo la palla.", "Il palleggio cambia mano e riparte nella nuova direzione."], "tactics": "Si usa quando il difensore chiude lateralmente ed è molto vicino.", "errors": ["Rotazione lenta", "Palla esposta durante il giro", "Uscita senza vedere il campo"], "exam": "Giro in palleggio o virata: Superare una pressione ravvicinata ruotando e proteggendo la palla. Gli elementi tecnici essenziali sono: Si appoggia il piede interno come perno. Il corpo ruota proteggendo la palla. Il palleggio cambia mano e riparte nella nuova direzione. Dal punto di vista tattico, si usa quando il difensore chiude lateralmente ed è molto vicino."}, {"id": "pass-petto", "title": "Passaggio due mani dal petto", "area": "Passaggio", "icon": "⇉", "use": "Servire rapidamente un compagno su una linea diretta aperta.", "keys": ["Palla davanti al petto", "Spinta di gambe, braccia e polsi", "Frustata finale e passo"], "technique": ["Mani dietro la palla e gomiti naturalmente stretti.", "Braccia distese verso il bersaglio.", "Pollici, indici e medi completano la spinta."], "tactics": "Si usa su linea diretta, spesso in contropiede o contro una difesa a zona.", "errors": ["Gomiti larghi", "Palla lenta ad arco", "Passo fuori direzione"], "exam": "Passaggio due mani dal petto: Servire rapidamente un compagno su una linea diretta aperta. Gli elementi tecnici essenziali sono: Mani dietro la palla e gomiti naturalmente stretti. Braccia distese verso il bersaglio. Pollici, indici e medi completano la spinta. Dal punto di vista tattico, si usa su linea diretta, spesso in contropiede o contro una difesa a zona."}, {"id": "pass-schiacciato", "title": "Passaggio due mani schiacciato", "area": "Passaggio", "icon": "↘", "use": "Superare braccia o pressione usando la linea bassa.", "keys": ["Partenza dalla cintola", "Rimbalzo circa a due terzi", "Ricezione all’altezza utile"], "technique": ["Tecnica simile al passaggio dal petto.", "La spinta è orientata verso il terreno.", "La traiettoria deve restare tesa e prevedibile per il compagno."], "tactics": "Si usa quando la linea aerea è chiusa e c’è spazio vicino al terreno.", "errors": ["Rimbalzo troppo vicino", "Passaggio molle", "Usarlo con difensore a contatto sulla linea bassa"], "exam": "Passaggio due mani schiacciato: Superare braccia o pressione usando la linea bassa. Gli elementi tecnici essenziali sono: Tecnica simile al passaggio dal petto. La spinta è orientata verso il terreno. La traiettoria deve restare tesa e prevedibile per il compagno. Dal punto di vista tattico, si usa quando la linea aerea è chiusa e c’è spazio vicino al terreno."}, {"id": "pass-testa", "title": "Passaggio sopra la testa", "area": "Passaggio", "icon": "⇈", "use": "Utilizzare una linea di passaggio alta sopra difensori o pressione.", "keys": ["Palla sopra la fronte", "Gomiti sotto la palla", "Spinta di mani e polsi"], "technique": ["Le braccia si distendono verso il ricevente.", "I polsi e le dita danno direzione.", "Un piccolo passo accompagna il passaggio."], "tactics": "Si usa quando la linea libera è sopra la testa o sopra le spalle.", "errors": ["Portare la palla dietro la testa", "Passaggio a parabola lenta", "Gomiti troppo aperti"], "exam": "Passaggio sopra la testa: Utilizzare una linea di passaggio alta sopra difensori o pressione. Gli elementi tecnici essenziali sono: Le braccia si distendono verso il ricevente. I polsi e le dita danno direzione. Un piccolo passo accompagna il passaggio. Dal punto di vista tattico, si usa quando la linea libera è sopra la testa o sopra le spalle."}, {"id": "pass-laterale", "title": "Passaggio laterale a una o due mani", "area": "Passaggio", "icon": "↝", "use": "Aggirare il difensore aprendo una linea laterale.", "keys": ["Perno ed equilibrio", "Palla fuori dalla sagoma difensiva", "Polso orientato al bersaglio"], "technique": ["Il corpo crea una finestra laterale.", "Il braccio distende senza perdere controllo.", "Il passo e il passaggio sono coordinati."], "tactics": "Si sceglie quando il difensore chiude la linea centrale ma lascia spazio laterale.", "errors": ["Sbilanciarsi", "Telegrafare la direzione", "Palla esposta prima del rilascio"], "exam": "Passaggio laterale a una o due mani: Aggirare il difensore aprendo una linea laterale. Gli elementi tecnici essenziali sono: Il corpo crea una finestra laterale. Il braccio distende senza perdere controllo. Il passo e il passaggio sono coordinati. Dal punto di vista tattico, si sceglie quando il difensore chiude la linea centrale ma lascia spazio laterale."}, {"id": "pass-baseball", "title": "Passaggio baseball", "area": "Passaggio", "icon": "➶", "use": "Coprire una grande distanza con rapidità e precisione.", "keys": ["Palla vicino alla spalla", "Rotazione coordinata del corpo", "Traiettoria tesa verso lo spazio"], "technique": ["Presa salda con mano di spinta e guida iniziale.", "Gambe e tronco producono forza.", "Il braccio completa il movimento verso il bersaglio."], "tactics": "Si usa soprattutto per apertura lunga e contropiede.", "errors": ["Solo forza del braccio", "Traiettoria alta e lenta", "Bersaglio fermo invece dello spazio"], "exam": "Passaggio baseball: Coprire una grande distanza con rapidità e precisione. Gli elementi tecnici essenziali sono: Presa salda con mano di spinta e guida iniziale. Gambe e tronco producono forza. Il braccio completa il movimento verso il bersaglio. Dal punto di vista tattico, si usa soprattutto per apertura lunga e contropiede."}, {"id": "pass-consegnato", "title": "Passaggio consegnato", "area": "Passaggio", "icon": "⇄", "use": "Trasferire la palla a un compagno vicino mantenendo protezione e continuità.", "keys": ["Palla protetta", "Compagno passa vicino", "Consegna nel tempo corretto"], "technique": ["Il portatore presenta la palla sul lato protetto.", "Il ricevente entra vicino e prende con due mani.", "Corpi e traiettorie limitano l’intervento difensivo."], "tactics": "Può creare un cambio di lato, una penetrazione o una collaborazione simile a un blocco.", "errors": ["Palla lontana dal corpo", "Distanza eccessiva", "Consegna senza leggere il difensore"], "exam": "Passaggio consegnato: Trasferire la palla a un compagno vicino mantenendo protezione e continuità. Gli elementi tecnici essenziali sono: Il portatore presenta la palla sul lato protetto. Il ricevente entra vicino e prende con due mani. Corpi e traiettorie limitano l’intervento difensivo. Dal punto di vista tattico, può creare un cambio di lato, una penetrazione o una collaborazione simile a un blocco."}, {"id": "pass-palleggio", "title": "Passaggio da palleggio", "area": "Passaggio", "icon": "➠", "use": "Ridurre il tempo tra ultimo palleggio e passaggio, mantenendo il vantaggio.", "keys": ["Lettura prima della raccolta", "Spinta diretta dal palleggio", "Precisione con una mano"], "technique": ["La mano accompagna la palla dal rimbalzo al passaggio.", "Il gesto evita una presa intermedia lenta.", "Corpo e piedi restano orientati alla scelta."], "tactics": "Si usa quando il tempo disponibile è minimo e la linea si apre durante il palleggio.", "errors": ["Fermare inutilmente la palla", "Passaggio senza equilibrio", "Mano debole non allenata"], "exam": "Passaggio da palleggio: Ridurre il tempo tra ultimo palleggio e passaggio, mantenendo il vantaggio. Gli elementi tecnici essenziali sono: La mano accompagna la palla dal rimbalzo al passaggio. Il gesto evita una presa intermedia lenta. Corpo e piedi restano orientati alla scelta. Dal punto di vista tattico, si usa quando il tempo disponibile è minimo e la linea si apre durante il palleggio."}, {"id": "finte", "title": "Finte con e senza palla", "area": "Attacco", "icon": "≈", "use": "Provocare una reazione difensiva per aprire spazio o tempo vantaggioso.", "keys": ["Gesto credibile", "Leggere la risposta", "Attaccare subito il vantaggio"], "technique": ["Occhi, palla, piedi e corpo comunicano un’intenzione.", "L’ampiezza è sufficiente a provocare risposta, non eccessiva.", "La seconda azione parte senza pausa."], "tactics": "Una finta è utile solo se collegata alla lettura e a un’azione successiva efficace.", "errors": ["Finta troppo grande", "Guardare già la seconda scelta", "Nessuna accelerazione dopo la reazione"], "exam": "Finte con e senza palla: Provocare una reazione difensiva per aprire spazio o tempo vantaggioso. Gli elementi tecnici essenziali sono: Occhi, palla, piedi e corpo comunicano un’intenzione. L’ampiezza è sufficiente a provocare risposta, non eccessiva. La seconda azione parte senza pausa. Dal punto di vista tattico, una finta è utile solo se collegata alla lettura e a un’azione successiva efficace."}, {"id": "tiro-fermo", "title": "Tiro da fermo", "area": "Tiro", "icon": "⌂", "use": "Concludere in equilibrio senza elevazione s ion></div></div>`}
