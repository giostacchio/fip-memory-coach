argin:18px 0;padding:18px;border-radius:14px;background:#fff;border:2px solid var(--c)}.retry-badge{display:inline-block;background:var(--o);color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.family-map{margin:18px 0;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px}.family-map ul{columns:2;line-height:1.55}.locked textarea{background:#eef8f4}.locked .palla-letter{background:#278265}@media (max-width:800px){.palla-intro{grid-template-columns:1fr;padding:22px 17px}.palla-word b{width:45px;height:45px;font-size:21px}.families{grid-template-columns:1fr 1fr}.palla-toolbar{grid-template-columns:1fr}.palla-box{grid-template-columns:42px 1fr;padding:13px}.palla-letter{width:40px;height:40px}.family-map ul{columns:1}}</style></head><body><header class="top"><b>🏀 FIP MEMORY COACH</b><span id="count"></span></header><nav class="tabs" id="tabs"></nav><main id="app"></main><script>const D={topics:[{id:"difesa",title:"Posizione e difesa sulla palla",area:"Difesa",icon:"◇",use:"Contenere l’attaccante, togliere spazio utile e recuperare la palla.",keys:["Equilibrio e reattività","Distanza adeguata","Petto davanti alla palla"],technique:["Piedi attivi, base stabile e busto pronto.","Scivolare senza incrociare i piedi quando possibile.","Mani attive coerenti con palla e linee di passaggio."],tactics:"La distanza cambia secondo capacità dell’attaccante, posizione della palla e spazio da proteggere.",errors:["Peso sui talloni","Piedi che si uniscono","Cercare la palla perdendo posizione"],exam:"La difesa sulla palla nasce dalla posizione fondamentale e dalla distanza. Il difensore deve rimanere equilibrato, orientare l’attaccante e mantenere il petto davanti alla palla, usando piedi e mani in modo coordinato."},{id:"posizione-off",title:"Posizione fondamentale offensiva",area:"Senza palla",icon:"△",use:"Essere pronti per giocare e per eseguire rapidamente i fondamentali senza palla.",keys:["Piedi paralleli alla larghezza di spalle o bacino","Peso sugli avampiedi, caviglie e ginocchia piegate","Busto avanti, mani pronte e visione periferica"],technique:["Piedi disposti parallelamente alla larghezza di spalle o bacino.","Peso del corpo sugli avampiedi.","Caviglie e ginocchia piegate.","Busto leggermente inclinato in avanti.","Braccia vicine al busto, gomiti piegati e mani pronte.","Sguardo rivolto a tutto il campo con visione periferica."],tactics:"La posizione fondamentale è importante per essere pronti per giocare.",errors:["Peso sui talloni e gambe tese","Mani non pronte","Sguardo limitato e assenza di visione periferica"],exam:"Posizione fondamentale offensiva. A cosa serve: Essere pronti per giocare e per eseguire rapidamente i fondamentali senza palla. Tecnica: Piedi disposti parallelamente alla larghezza di spalle o bacino. Peso del corpo sugli avampiedi. Caviglie e ginocchia piegate. Busto leggermente inclinato in avanti. Braccia vicine al busto, gomiti piegati e mani pronte. Sguardo rivolto a tutto il campo con visione periferica. Tattica: La posizione fondamentale è importante per essere pronti per giocare.",cna:!0,source:"Dispensa CNA caricata"},{id:"corsa-cestistica",title:"Corsa cestistica",area:"Senza palla",icon:"➜",use:"Muoversi mantenendo la possibilità di cambiare improvvisamente direzione, senso, velocità, arrestarsi o fintare.",keys:["Baricentro più basso della corsa normale","Piedi il più possibile a contatto col suolo","Corpo pronto a cambiare o arrestarsi"],technique:["Baricentro più basso rispetto alla normale corsa di un velocista.","I piedi mantengono quanto più possibile il contatto con il suolo.","La corsa conserva disponibilità per cambi, arresti e finte."],tactics:"Permette repentini cambi di direzione, cambi di senso, arresti e finte.",errors:["Correre con baricentro alto","Fase di volo troppo accentuata","Non essere pronti al cambio o all’arresto"],exam:"Corsa cestistica. A cosa serve: Muoversi mantenendo la possibilità di cambiare improvvisamente direzione, senso, velocità, arrestarsi o fintare. Tecnica: Baricentro più basso rispetto alla normale corsa di un velocista. I piedi mantengono quanto più possibile il contatto con il suolo. La corsa conserva disponibilità per cambi, arresti e finte. Tattica: Permette repentini cambi di direzione, cambi di senso, arresti e finte.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio-vel-senza",title:"Cambio di velocità senza palla",area:"Senza palla",icon:"⚡",use:"Prendere o mantenere vantaggio attraverso una variazione del ritmo di corsa.",keys:["Lento-veloce per attaccare direttamente uno spazio","Veloce-lento per sbilanciare l’avversario","Spesso si abbina ad altri fondamentali"],technique:["Nel lento-veloce si passa da corsa lenta a corsa veloce.","Nel veloce-lento si riduce improvvisamente la velocità.","La variazione deve essere leggibile come reale dal difensore.","Il cambio di velocità è spesso accoppiato ad altri fondamentali."],tactics:"Il lento-veloce permette di arrivare prima dell’avversario nello spazio; il veloce-lento serve a sbilanciarlo e poi occupare lo spazio vantaggioso.",errors:["Variazione di ritmo poco evidente","Nessuna successiva occupazione dello spazio","Cambio di velocità scollegato dalla lettura"],exam:"Cambio di velocità senza palla. A cosa serve: Prendere o mantenere vantaggio attraverso una variazione del ritmo di corsa. Tecnica: Nel lento-veloce si passa da corsa lenta a corsa veloce. Nel veloce-lento si riduce improvvisamente la velocità. La variazione deve essere leggibile come reale dal difensore. Il cambio di velocità è spesso accoppiato ad altri fondamentali. Tattica: Il lento-veloce permette di arrivare prima dell’avversario nello spazio; il veloce-lento serve a sbilanciarlo e poi occupare lo spazio vantaggioso.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio-dir-omo",title:"Cambio di direzione omologo senza palla",area:"Senza palla",icon:"⤴",use:"Cambiare direzione nel minor tempo possibile in una situazione dinamica con spazio disponibile.",keys:["Primo passo accorciato col piede opposto alla nuova direzione","Rotazione sull’avampiede e torsione del busto","Spinta, secondo passo lungo e cambio di velocità"],technique:["Primo passo accorciato nella direzione originale con il piede opposto alla nuova direzione.","Peso sull’avampiede del piede di appoggio e spinta.","Ginocchia piegate e baricentro basso.","Rotazione sull’avampiede e torsione del busto.","Spinta nella nuova direzione e trasferimento del peso.","Secondo passo lungo e cambio di velocità."],tactics:"Si effettua in situazione dinamica con spazio disponibile; è il cambio più immediato e veloce, per esempio nel taglio in contropiede senza interrompere la corsa.",errors:["Primo passo troppo lungo","Baricentro alto","Mancanza del cambio di velocità"],exam:"Cambio di direzione omologo senza palla. A cosa serve: Cambiare direzione nel minor tempo possibile in una situazione dinamica con spazio disponibile. Tecnica: Primo passo accorciato nella direzione originale con il piede opposto alla nuova direzione. Peso sull’avampiede del piede di appoggio e spinta. Ginocchia piegate e baricentro basso. Rotazione sull’avampiede e torsione del busto. Spinta nella nuova direzione e trasferimento del peso. Secondo passo lungo e cambio di velocità. Tattica: Si effettua in situazione dinamica con spazio disponibile; è il cambio più immediato e veloce, per esempio nel taglio in contropiede senza interrompere la corsa.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio-dir-inc",title:"Cambio di direzione incrociato senza palla",area:"Senza palla",icon:"⤵",use:"Cambiare direzione in situazione statica o poco dinamica quando esiste spazio per incrociare.",keys:["Peso sull’avampiede nella nuova direzione","Il piede opposto incrocia come primo passo","Secondo passo lungo e cambio di velocità"],technique:["Baricentro basso e ginocchia piegate.","Peso sull’avampiede del piede posto nella direzione da prendere.","Spinta nella nuova direzione.","Il piede opposto alla nuova direzione incrocia ed esegue il primo passo.","Trasferimento del peso sulla gamba che ha incrociato.","Cambio di velocità e secondo passo lungo."],tactics:"Si usa in situazione statica o leggermente dinamica quando c’è spazio per incrociare, per esempio su un taglio contrastato da un body check.",errors:["Incrocio senza spazio","Baricentro alto","Ripartenza senza cambio di velocità"],exam:"Cambio di direzione incrociato senza palla. A cosa serve: Cambiare direzione in situazione statica o poco dinamica quando esiste spazio per incrociare. Tecnica: Baricentro basso e ginocchia piegate. Peso sull’avampiede del piede posto nella direzione da prendere. Spinta nella nuova direzione. Il piede opposto alla nuova direzione incrocia ed esegue il primo passo. Trasferimento del peso sulla gamba che ha incrociato. Cambio di velocità e secondo passo lungo. Tattica: Si usa in situazione statica o leggermente dinamica quando c’è spazio per incrociare, per esempio su un taglio contrastato da un body check.",cna:!0,source:"Dispensa CNA caricata"},{id:"giro-frontale",title:"Giro frontale",area:"Senza palla",icon:"↶",use:"Cambiare orientamento rapidamente quando è presente spazio.",keys:["Peso sull’avampiede del piede perno","Spinta in avanti con il piede libero","Perno fermo, baricentro basso e testa alta"],technique:["Peso sull’avampiede del piede perno.","Posizione fondamentale e baricentro basso.","Spinta in avanti con il piede libero.","Il piede perno resta fermo a terra sull’avampiede.","Testa alta."],tactics:"È il giro più veloce e si esegue in presenza di spazio, per esempio dopo un blocco quando il bloccante ha spazio.",errors:["Spostare il piede perno","Baricentro alto","Usarlo senza spazio"],exam:"Giro frontale. A cosa serve: Cambiare orientamento rapidamente quando è presente spazio. Tecnica: Peso sull’avampiede del piede perno. Posizione fondamentale e baricentro basso. Spinta in avanti con il piede libero. Il piede perno resta fermo a terra sull’avampiede. Testa alta. Tattica: È il giro più veloce e si esegue in presenza di spazio, per esempio dopo un blocco quando il bloccante ha spazio.",cna:!0,source:"Dispensa CNA caricata"},{id:"giro-dorsale",title:"Giro dorsale",area:"Senza palla",icon:"↷",use:"Cambiare orientamento proteggendosi quando lo spazio è assente.",keys:["Peso sull’avampiede del piede perno","Spinta indietro con il piede libero","Perno fermo, baricentro basso e testa alta"],technique:["Peso sull’avampiede del piede perno.","Posizione fondamentale con caviglie piegate e busto leggermente avanti.","Baricentro basso.","Spinta verso dietro con il piede libero.","Il piede perno resta fermo a terra sull’avampiede.","Testa alta."],tactics:"È meno veloce del giro frontale e si usa in assenza di spazio, per esempio quando il difensore resta a contatto col bloccante.",errors:["Spostare il piede perno","Giro largo con perdita di equilibrio","Usarlo quando il giro frontale sarebbe più rapido"],exam:"Giro dorsale. A cosa serve: Cambiare orientamento proteggendosi quando lo spazio è assente. Tecnica: Peso sull’avampiede del piede perno. Posizione fondamentale con caviglie piegate e busto leggermente avanti. Baricentro basso. Spinta verso dietro con il piede libero. Il piede perno resta fermo a terra sull’avampiede. Testa alta. Tattica: È meno veloce del giro frontale e si usa in assenza di spazio, per esempio quando il difensore resta a contatto col bloccante.",cna:!0,source:"Dispensa CNA caricata"},{id:"arresto-uno",title:"Arresto ad un tempo",area:"Senza palla",icon:"▣",use:"Arrestarsi in equilibrio conservando la possibilità di scegliere il piede perno.",keys:["Saltello prima dell’arresto","Atterraggio simultaneo sugli avampiedi","Peso su entrambi i piedi e testa alta"],technique:["Saltello prima di arrestarsi.","Atterraggio su entrambi i piedi e sugli avampiedi.","Piedi larghi quanto le spalle.","Caviglie e ginocchia piegate.","Peso distribuito su entrambi i piedi.","Testa alta."],tactics:"Permette di scegliere il piede perno; si usa con velocità non elevata o quando direzione ed equilibrio lo consentono, per esempio nel penetro e scarico.",errors:["Atterrare prima su un piede","Gambe rigide","Perdere equilibrio in avanti"],exam:"Arresto ad un tempo. A cosa serve: Arrestarsi in equilibrio conservando la possibilità di scegliere il piede perno. Tecnica: Saltello prima di arrestarsi. Atterraggio su entrambi i piedi e sugli avampiedi. Piedi larghi quanto le spalle. Caviglie e ginocchia piegate. Peso distribuito su entrambi i piedi. Testa alta. Tattica: Permette di scegliere il piede perno; si usa con velocità non elevata o quando direzione ed equilibrio lo consentono, per esempio nel penetro e scarico.",cna:!0,source:"Dispensa CNA caricata"},{id:"arresto-due",title:"Arresto a due tempi",area:"Senza palla",icon:"Ⅱ",use:"Arrestarsi quando velocità o direzione non favoriscono l’arresto a un tempo.",keys:["Il primo piede rallenta ed è il perno","Il peso si scarica sul primo piede","Il secondo piede ricrea equilibrio"],technique:["Il primo piede che tocca terra rallenta la corsa ed è il piede perno.","Il peso viene scaricato sul primo piede.","Il secondo piede ricrea l’equilibrio.","Ginocchia e caviglie piegate.","Peso finale su entrambi i piedi.","Sguardo rivolto al campo."],tactics:"Si usa a velocità elevata o con direzione sfavorevole all’arresto a un tempo, per esempio in uscita da un blocco o in contropiede.",errors:["Confondere il piede perno","Secondo appoggio che non ristabilisce equilibrio","Sguardo basso"],exam:"Arresto a due tempi. A cosa serve: Arrestarsi quando velocità o direzione non favoriscono l’arresto a un tempo. Tecnica: Il primo piede che tocca terra rallenta la corsa ed è il piede perno. Il peso viene scaricato sul primo piede. Il secondo piede ricrea l’equilibrio. Ginocchia e caviglie piegate. Peso finale su entrambi i piedi. Sguardo rivolto al campo. Tattica: Si usa a velocità elevata o con direzione sfavorevole all’arresto a un tempo, per esempio in uscita da un blocco o in contropiede.",cna:!0,source:"Dispensa CNA caricata"},{id:"dif-posizione",title:"Posizione fondamentale difensiva",area:"Difesa",icon:"◇",use:"Essere pronti a effettuare qualsiasi movimento funzionale alla difesa.",keys:["Piedi carichi e poco più larghi delle spalle","Peso sugli avampiedi","Mani attive, palmi alla palla e occhi che guardano"],technique:["Piedi carichi a distanza leggermente superiore alla larghezza delle spalle.","Peso del corpo sugli avampiedi.","Mani e braccia attive.","Palmi rivolti verso il pallone.","Capo eretto e occhi che guardano."],tactics:"La distanza dipende dalla posizione della palla: palla bassa significa distanza maggiore; palla alta significa distanza minore.",errors:["Peso sui talloni","Mani e braccia passive","Distanza non adattata alla posizione della palla"],exam:"Posizione fondamentale difensiva. A cosa serve: Essere pronti a effettuare qualsiasi movimento funzionale alla difesa. Tecnica: Piedi carichi a distanza leggermente superiore alla larghezza delle spalle. Peso del corpo sugli avampiedi. Mani e braccia attive. Palmi rivolti verso il pallone. Capo eretto e occhi che guardano. Tattica: La distanza dipende dalla posizione della palla: palla bassa significa distanza maggiore; palla alta significa distanza minore.",cna:!0,source:"Dispensa CNA caricata"},{id:"dif-palleggiatore",title:"Posizione sul palleggiatore",area:"Difesa",icon:"⊙",use:"Contenere il palleggiatore ostacolando cambio di mano e linea di passaggio.",keys:["Posizione fondamentale difensiva","Mano opposta al palleggio tra le ginocchia","Mano concorde traccia la palla"],technique:["Assumere la posizione fondamentale difensiva.","La mano del braccio opposto alla mano che palleggia è tra le ginocchia del palleggiatore.","La mano del braccio concorde alla mano che palleggia traccia la palla e chiude la linea di passaggio."],tactics:"Le mani assumono compiti differenti in funzione della mano di palleggio e delle linee da togliere.",errors:["Due mani con lo stesso compito","Cercare la palla perdendo posizione","Non adattarsi alla mano di palleggio"],exam:"Posizione sul palleggiatore. A cosa serve: Contenere il palleggiatore ostacolando cambio di mano e linea di passaggio. Tecnica: Assumere la posizione fondamentale difensiva. La mano del braccio opposto alla mano che palleggia è tra le ginocchia del palleggiatore. La mano del braccio concorde alla mano che palleggia traccia la palla e chiude la linea di passaggio. Tattica: Le mani assumono compiti differenti in funzione della mano di palleggio e delle linee da togliere.",cna:!0,source:"Dispensa CNA caricata"},{id:"scivolamenti",title:"Scivolamenti difensivi",area:"Difesa",icon:"⇔",use:"Raggiungere in modo regolamentare lo spazio vantaggioso nel minor tempo possibile.",keys:["Piedi vivi e spinta del piede opposto","Apre per primo il piede nella direzione","Il secondo piede ristabilisce la distanza iniziale"],technique:["Posizione fondamentale con piedi vivi.","Spinta con il piede opposto alla direzione dello spostamento.","Il primo piede a muoversi corrisponde alla direzione dello spostamento.","Il secondo piede è quello che ha spinto e ristabilisce l’equilibrio alla distanza iniziale.","Le braccia mantengono i compiti sulla mano di palleggio e sulla linea di passaggio."],tactics:"Permette di raggiungere regolamentarmente lo spazio vantaggioso nel minor tempo possibile.",errors:["Unire o incrociare i piedi durante lo scivolamento","Spingere col piede sbagliato","Perdere i compiti delle mani"],exam:"Scivolamenti difensivi. A cosa serve: Raggiungere in modo regolamentare lo spazio vantaggioso nel minor tempo possibile. Tecnica: Posizione fondamentale con piedi vivi. Spinta con il piede opposto alla direzione dello spostamento. Il primo piede a muoversi corrisponde alla direzione dello spostamento. Il secondo piede è quello che ha spinto e ristabilisce l’equilibrio alla distanza iniziale. Le braccia mantengono i compiti sulla mano di palleggio e sulla linea di passaggio. Tattica: Permette di raggiungere regolamentarmente lo spazio vantaggioso nel minor tempo possibile.",cna:!0,source:"Dispensa CNA caricata"},{id:"scivolo-corro",title:"Scivolo, corro, scivolo",area:"Difesa",icon:"⇢",use:"Riconquistare lo spazio-tempo perso e tornare a contenere.",keys:["Dalla posizione difensiva si incrociano i piedi","Busto aperto verso la palla","Recuperato lo spazio si torna a scivolare"],technique:["Dalla posizione fondamentale si incrociano i piedi.","Spinta col piede più vicino alla direzione da prendere.","Il busto resta aperto verso la palla.","La mano opposta alla mano di palleggio ostacola il cambio.","La mano concorde traccia la palla.","Recuperato lo spazio, ritorno in posizione fondamentale per scivolare."],tactics:"La sequenza scivolare-correre-scivolare permette di riconquistare lo spazio-tempo perso.",errors:["Restare in corsa dopo il recupero","Chiudere il busto rispetto alla palla","Non tornare in posizione fondamentale"],exam:"Scivolo, corro, scivolo. A cosa serve: Riconquistare lo spazio-tempo perso e tornare a contenere. Tecnica: Dalla posizione fondamentale si incrociano i piedi. Spinta col piede più vicino alla direzione da prendere. Il busto resta aperto verso la palla. La mano opposta alla mano di palleggio ostacola il cambio. La mano concorde traccia la palla. Recuperato lo spazio, ritorno in posizione fondamentale per scivolare. Tattica: La sequenza scivolare-correre-scivolare permette di riconquistare lo spazio-tempo perso.",cna:!0,source:"Dispensa CNA caricata"},{id:"posizionamento-dif",title:"Linee del posizionamento difensivo",area:"Difesa",icon:"╱",use:"Orientare la difesa attraverso linea di passaggio, linea di penetrazione e linea della palla.",keys:["Linea di passaggio: palla-giocatore senza palla","Linea di penetrazione: palla-canestro","Linea della palla: parallela alla linea di fondo"],technique:["La linea di passaggio congiunge il giocatore con palla ai giocatori senza palla.","La linea di penetrazione congiunge il giocatore con palla al canestro.","La linea della palla è parallela alla linea di fondo e passa attraverso la palla."],tactics:"Le tre linee determinano posizionamento, anticipo, aiuto e rotazioni con l’obiettivo comune di non subire tiri ad alta percentuale.",errors:["Guardare solo il proprio uomo","Ignorare la linea di penetrazione","Non adeguare la posizione allo spostamento della palla"],exam:"Linee del posizionamento difensivo. A cosa serve: Orientare la difesa attraverso linea di passaggio, linea di penetrazione e linea della palla. Tecnica: La linea di passaggio congiunge il giocatore con palla ai giocatori senza palla. La linea di penetrazione congiunge il giocatore con palla al canestro. La linea della palla è parallela alla linea di fondo e passa attraverso la palla. Tattica: Le tre linee determinano posizionamento, anticipo, aiuto e rotazioni con l’obiettivo comune di non subire tiri ad alta percentuale.",cna:!0,source:"Dispensa CNA caricata"},{id:"anticipo-chiuso",title:"Anticipo chiuso",area:"Difesa",icon:"◀",use:"Negare la ricezione dando priorità al giocatore senza palla.",keys:["Petto verso il giocatore senza palla","Piede e mano lato palla sulla linea","Palmo alla palla con pollice verso il basso"],technique:["Posizione fondamentale e visione periferica di palla e uomo.","In staticità, peso su entrambi i piedi.","Posizione di taglio col petto verso l’avversario senza palla.","Piede e mano lato palla sulla o sopra la linea di passaggio.","Palmo della mano di anticipo verso la palla e pollice verso il basso.","Braccio semiflesso e piccoli scivolamenti."],tactics:"Si usa contro grandi tiratori per non perdere il contatto visivo e impedire loro di ricevere.",errors:["Petto orientato alla palla","Pollice verso l’alto","Perdere il contatto visivo col tiratore"],exam:"Anticipo chiuso. A cosa serve: Negare la ricezione dando priorità al giocatore senza palla. Tecnica: Posizione fondamentale e visione periferica di palla e uomo. In staticità, peso su entrambi i piedi. Posizione di taglio col petto verso l’avversario senza palla. Piede e mano lato palla sulla o sopra la linea di passaggio. Palmo della mano di anticipo verso la palla e pollice verso il basso. Braccio semiflesso e piccoli scivolamenti. Tattica: Si usa contro grandi tiratori per non perdere il contatto visivo e impedire loro di ricevere.",cna:!0,source:"Dispensa CNA caricata"},{id:"anticipo-aperto",title:"Anticipo aperto",area:"Difesa",icon:"▶",use:"Controllare uomo e palla dando priorità al giocatore con palla.",keys:["Petto verso la palla","Piede e mano lato uomo sulla linea","Palmo alla palla con pollice verso l’alto"],technique:["Posizione fondamentale e visione periferica di palla e uomo con priorità alla palla.","In staticità, peso su entrambi i piedi.","Posizione di taglio col petto verso la palla.","Piede e mano lato giocatore da marcare sulla o sopra la linea di passaggio.","Palmo della mano di anticipo verso la palla e pollice verso l’alto.","Braccio semiflesso e piccoli scivolamenti."],tactics:"Si usa contro forti penetratori per mantenere il contatto visivo con la palla e leggere aiuto e rotazione nel tempo giusto.",errors:["Petto verso il giocatore senza palla","Pollice verso il basso","Perdere la lettura della penetrazione"],exam:"Anticipo aperto. A cosa serve: Controllare uomo e palla dando priorità al giocatore con palla. Tecnica: Posizione fondamentale e visione periferica di palla e uomo con priorità alla palla. In staticità, peso su entrambi i piedi. Posizione di taglio col petto verso la palla. Piede e mano lato giocatore da marcare sulla o sopra la linea di passaggio. Palmo della mano di anticipo verso la palla e pollice verso l’alto. Braccio semiflesso e piccoli scivolamenti. Tattica: Si usa contro forti penetratori per mantenere il contatto visivo con la palla e leggere aiuto e rotazione nel tempo giusto.",cna:!0,source:"Dispensa CNA caricata"},{id:"difesa-no-palla",title:"Difesa sul giocatore senza palla",area:"Difesa",icon:"◆",use:"Negare ricezioni vantaggiose mantenendo visione di palla e uomo.",keys:["Posizione rispetto alla palla","Linea di passaggio controllata","Vedere uomo e palla"],technique:["Piede e mano lato palla occupano la linea utile.","Il corpo si orienta secondo distanza e pericolosità.","La posizione cambia mentre la palla si muove."],tactics:"Può essere più aggressiva o di contenimento, ma deve proteggere tagli e spazi pericolosi.",errors:["Guardare solo la palla","Perdere il contatto visivo con l’uomo","Posizione statica"],exam:"Difesa sul giocatore senza palla: Negare ricezioni vantaggiose mantenendo visione di palla e uomo. Gli elementi tecnici essenziali sono: Piede e mano lato palla occupano la linea utile. Il corpo si orienta secondo distanza e pericolosità. La posizione cambia mentre la palla si muove. Dal punto di vista tattico, può essere più aggressiva o di contenimento, ma deve proteggere tagli e spazi pericolosi."},{id:"linea-passaggio",title:"Linea di passaggio e anticipo",area:"Difesa",icon:"╱",use:"Ostacolare o negare il collegamento tra passatore e ricevente.",keys:["Corpo sulla linea utile","Braccio semiflesso attivo","Equilibrio per contenere il taglio"],technique:["Il difensore occupa la linea con piede e mano lato palla.","Il petto è orientato secondo la scelta difensiva.","La distanza consente anticipo senza essere battuti facilmente."],tactics:"La pressione sulla linea dipende da posizione della palla, spazio e rischio di taglio back-door.",errors:["Braccio rigido","Corpo completamente girato","Anticipo senza copertura dello spazio dietro"],exam:"Linea di passaggio e anticipo: Ostacolare o negare il collegamento tra passatore e ricevente. Gli elementi tecnici essenziali sono: Il difensore occupa la linea con piede e mano lato palla. Il petto è orientato secondo la scelta difensiva. La distanza consente anticipo senza essere battuti facilmente. Dal punto di vista tattico, la pressione sulla linea dipende da posizione della palla, spazio e rischio di taglio back-door."},{id:"posizione-palla",title:"Posizione fondamentale con palla",area:"Con palla",icon:"▴",use:"Eseguire qualsiasi movimento offensivo con palla nel minor tempo possibile.",keys:["Piedi paralleli alla larghezza delle spalle e peso sugli avampiedi","Caviglie e ginocchia piegate, busto leggermente avanti","Pollici a T, polso carico e visione periferica"],technique:["Piedi paralleli a distanza pari alla larghezza delle spalle.","Peso del corpo sugli avampiedi.","Caviglie e ginocchia piegate e busto leggermente inclinato in avanti.","Gomito della mano posta dietro la palla vicino al fianco.","Mano dietro la palla con polso carico in triplice minaccia.","Presa con pollici a T e altra mano laterale alla palla.","Sguardo rivolto al campo con visione periferica."],tactics:"È la posizione che permette di eseguire qualsiasi movimento nel minor tempo possibile.",errors:["Gambe tese o peso sui talloni","Polso non carico e palla non pronta","Sguardo sulla palla invece che sul campo"],exam:"Posizione fondamentale con palla. A cosa serve: Eseguire qualsiasi movimento offensivo con palla nel minor tempo possibile. Tecnica: Piedi paralleli a distanza pari alla larghezza delle spalle. Peso del corpo sugli avampiedi. Caviglie e ginocchia piegate e busto leggermente inclinato in avanti. Gomito della mano posta dietro la palla vicino al fianco. Mano dietro la palla con polso carico in triplice minaccia. Presa con pollici a T e altra mano laterale alla palla. Sguardo rivolto al campo con visione periferica. Tattica: È la posizione che permette di eseguire qualsiasi movimento nel minor tempo possibile.",cna:!0,source:"Dispensa CNA caricata"},{id:"presa",title:"Presa e ricezione della palla",area:"Attacco",icon:"◉",use:"Ricevere e controllare completamente la palla per utilizzare senza perdita di tempo il fondamentale successivo.",keys:["Chiamare la palla","Andare incontro alla palla","Presa completa e sicura"],technique:["La ricezione è l’insieme di chiamare la palla, andare incontro alla stessa ed eseguire una presa completa e sicura.","Nella presa a due mani le dita sono naturalmente distese lateralmente e dietro la palla, con pollici e indici convergenti.","Nella presa a una mano, in realtà sostenuta da entrambe, i pollici assumono la posizione a T.","L’asta verticale della T è formata dal pollice della mano forte.","Il polso carico permette maggiore velocità nell’uso dei fondamentali offensivi con palla."],tactics:"Una presa corretta, completa e sicura consente di leggere lo spazio vantaggioso e attaccarlo immediatamente senza perdere tempo.",errors:["Aspettare la palla senza chiamarla o andarle incontro","Presa incompleta o insicura","Polso non carico e ritardo nel fondamentale successivo"],exam:"Presa e ricezione della palla. A cosa serve: Ricevere e controllare completamente la palla per utilizzare senza perdita di tempo il fondamentale successivo. Tecnica: La ricezione è l’insieme di chiamare la palla, andare incontro alla stessa ed eseguire una presa completa e sicura. Nella presa a due mani le dita sono naturalmente distese lateralmente e dietro la palla, con pollici e indici convergenti. Nella presa a una mano, in realtà sostenuta da entrambe, i pollici assumono la posizione a T. L’asta verticale della T è formata dal pollice della mano forte. Il polso carico permette maggiore velocità nell’uso dei fondamentali offensivi con palla. Tattica: Una presa corretta, completa e sicura consente di leggere lo spazio vantaggioso e attaccarlo immediatamente senza perdere tempo.",cna:!0,source:"Dispensa CNA caricata"},{id:"palleggio",title:"Palleggio",area:"Attacco",icon:"●",use:"Prendere vantaggio, mantenere vantaggio o recuperare l’equilibrio di squadra.",keys:["Fase di contatto: palla governabile","Spinta alto-basso con avambraccio, polso e dita","Busto eretto e visione periferica"],technique:["La fase di volo è il momento in cui la palla non è governabile.","La fase di contatto è il momento in cui la palla è governabile.","Palla a contatto con i polpastrelli.","Spinta dall’alto verso il basso con avambraccio e frustata di polso e dita.","Busto eretto.","Sguardo avanti per la migliore visione periferica."],tactics:"Serve per prendere vantaggio, mantenerlo o recuperare l’equilibrio di squadra uscendo da situazioni pericolose o portando la palla dalla difesa all’attacco.",errors:["Guardare la palla","Colpire con il palmo","Palleggiare senza uno dei tre scopi"],exam:"Palleggio. A cosa serve: Prendere vantaggio, mantenere vantaggio o recuperare l’equilibrio di squadra. Tecnica: La fase di volo è il momento in cui la palla non è governabile. La fase di contatto è il momento in cui la palla è governabile. Palla a contatto con i polpastrelli. Spinta dall’alto verso il basso con avambraccio e frustata di polso e dita. Busto eretto. Sguardo avanti per la migliore visione periferica. Tattica: Serve per prendere vantaggio, mantenerlo o recuperare l’equilibrio di squadra uscendo da situazioni pericolose o portando la palla dalla difesa all’attacco.",cna:!0,source:"Dispensa CNA caricata"},{id:"palleggio-protetto",title:"Palleggio protetto",area:"Palleggio",icon:"◐",use:"Mantenere la palla e migliorare l’angolo di passaggio quando il difensore è a contatto.",keys:["Palla lontana dal difensore e all’altezza del ginocchio","Braccio libero a protezione con gomito a 90 gradi","Spalla e gamba opposte proteggono la palla"],technique:["Posizione fondamentale.","Palleggio lontano dal difensore e all’altezza del ginocchio.","Braccio che non palleggia in protezione con gomito piegato a 90 gradi.","La mano libera continua la direzione dell’avambraccio.","Spalla e gamba opposte alla mano di palleggio proteggono la palla."],tactics:"Si usa quando lo spazio fra palleggiatore e difensore si restringe e diventa minimo.",errors:["Palla vicina al difensore","Palleggio alto","Braccio libero scorretto o non funzionale alla protezione"],exam:"Palleggio protetto. A cosa serve: Mantenere la palla e migliorare l’angolo di passaggio quando il difensore è a contatto. Tecnica: Posizione fondamentale. Palleggio lontano dal difensore e all’altezza del ginocchio. Braccio che non palleggia in protezione con gomito piegato a 90 gradi. La mano libera continua la direzione dell’avambraccio. Spalla e gamba opposte alla mano di palleggio proteggono la palla. Tattica: Si usa quando lo spazio fra palleggiatore e difensore si restringe e diventa minimo.",cna:!0,source:"Dispensa CNA caricata"},{id:"palleggio-spinto",title:"Palleggio spinto",area:"Palleggio",icon:"➤",use:"Raggiungere uno spazio nel minor tempo possibile.",keys:["Mano di spinta dietro la palla","Spinta con braccio, avambraccio, polso e dita","Altezza circa alla cintura"],technique:["Mano di spinta posizionata dietro la palla.","Spinta impressa con braccio, avambraccio, polso, mano e dita.","Frustata finale delle dita.","Altezza del palleggio circa alla cintura."],tactics:"Con un avversario su un lato si usa una mano, quella lontana; senza avversari vicini si usa l’alternato, più veloce.",errors:["Mano solo sopra la palla","Altezza non funzionale alla corsa","Usare la mano vicina all’avversario"],exam:"Palleggio spinto. A cosa serve: Raggiungere uno spazio nel minor tempo possibile. Tecnica: Mano di spinta posizionata dietro la palla. Spinta impressa con braccio, avambraccio, polso, mano e dita. Frustata finale delle dita. Altezza del palleggio circa alla cintura. Tattica: Con un avversario su un lato si usa una mano, quella lontana; senza avversari vicini si usa l’alternato, più veloce.",cna:!0,source:"Dispensa CNA caricata"},{id:"palleggio-alternato",title:"Palleggio spinto alternato",area:"Palleggio",icon:"⇆",use:"Raggiungere rapidamente uno spazio quando non vi sono avversari vicini.",keys:["Mano di spinta dietro la palla","Alternanza delle mani","Palleggio circa alla cintura"],technique:["Tecnica del palleggio spinto.","Le mani si alternano durante l’avanzamento.","La spinta coinvolge braccio, avambraccio, polso e dita.","Altezza circa alla cintura."],tactics:"Senza avversari nelle vicinanze è più conveniente del palleggio spinto a una mano perché consente maggiore velocità.",errors:["Alternare le mani sotto pressione laterale","Perdere la visione del campo","Palleggio troppo vicino ai piedi"],exam:"Palleggio spinto alternato. A cosa serve: Raggiungere rapidamente uno spazio quando non vi sono avversari vicini. Tecnica: Tecnica del palleggio spinto. Le mani si alternano durante l’avanzamento. La spinta coinvolge braccio, avambraccio, polso e dita. Altezza circa alla cintura. Tattica: Senza avversari nelle vicinanze è più conveniente del palleggio spinto a una mano perché consente maggiore velocità.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio-velocita",title:"Cambio di velocità in palleggio",area:"Palleggio",icon:"⚡",use:"Occupare uno spazio vantaggioso modificando il rapporto fra mano, palla e velocità di corsa.",keys:["Lento-veloce: mano da sopra a dietro","Veloce-lento: mano da dietro a sopra","Palleggio alla cintola e visione periferica"],technique:["Nel lento-veloce la mano passa da sopra la palla a dietro la palla.","Nel veloce-lento la mano passa da dietro la palla a sopra la palla.","Palleggio all’altezza della cintola.","Occhi sul campo per una corretta visione periferica."],tactics:"Si usa per occupare uno spazio vantaggioso, passando da corsa lenta a veloce oppure da veloce a lenta.",errors:["Cambiare corsa senza cambiare posizione della mano","Guardare la palla","Nessuna occupazione dello spazio vantaggioso"],exam:"Cambio di velocità in palleggio. A cosa serve: Occupare uno spazio vantaggioso modificando il rapporto fra mano, palla e velocità di corsa. Tecnica: Nel lento-veloce la mano passa da sopra la palla a dietro la palla. Nel veloce-lento la mano passa da dietro la palla a sopra la palla. Palleggio all’altezza della cintola. Occhi sul campo per una corretta visione periferica. Tattica: Si usa per occupare uno spazio vantaggioso, passando da corsa lenta a veloce oppure da veloce a lenta.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio",title:"Cambio frontale incrociato e omologo",area:"Palleggio",icon:"↔",use:"Cambiare mano davanti al corpo in situazione statica o poco dinamica con spazio fra palleggiatore e difensore.",keys:["Palleggio protetto poi basso sotto le ginocchia","Spinta esterno-interno e incrocio del piede opposto","Controllo con l’altra mano e immediata spinta avanti"],technique:["Testa alta e sguardo sul campo.","Palleggio controllato e protetto al ginocchio.","La mano passa da sopra a laterale e spinge dall’esterno verso l’interno.","Palleggio basso sotto le ginocchia.","Spinta del piede concorde alla nuova direzione.","Il piede opposto alla nuova direzione incrocia.","Controllo con l’altra mano e immediata spinta avanti.","Arto inferiore, braccio e spalla opposti proteggono la palla.","Cambio di velocità."],tactics:"Il cambio frontale incrociato si usa in situazione statica o poco dinamica quando esiste spazio fra palleggiatore e difensore.",errors:["Cambio alto","Incrocio eseguito senza spazio","Nessuna immediata spinta avanti"],exam:"Cambio frontale incrociato e omologo. A cosa serve: Cambiare mano davanti al corpo in situazione statica o poco dinamica con spazio fra palleggiatore e difensore. Tecnica: Testa alta e sguardo sul campo. Palleggio controllato e protetto al ginocchio. La mano passa da sopra a laterale e spinge dall’esterno verso l’interno. Palleggio basso sotto le ginocchia. Spinta del piede concorde alla nuova direzione. Il piede opposto alla nuova direzione incrocia. Controllo con l’altra mano e immediata spinta avanti. Arto inferiore, braccio e spalla opposti proteggono la palla. Cambio di velocità. Tattica: Il cambio frontale incrociato si usa in situazione statica o poco dinamica quando esiste spazio fra palleggiatore e difensore.",cna:!0,source:"Dispensa CNA caricata"},{id:"cambio-omo-pal",title:"Cambio di mano frontale omologo",area:"Palleggio",icon:"⤡",use:"Cambiare mano davanti al corpo in situazione dinamica con spazio adeguato fra attaccante e difensore.",keys:["Palleggio basso e spinta esterno-interno","Spinta del piede opposto alla nuova direzione","Controllo e immediata spinta avanti con cambio di velocità"],technique:["Testa alta e sguardo sul campo.","Palleggio al ginocchio, poi basso sotto le ginocchia.","La mano passa da sopra a sopra-laterale.","Spinta della palla dall’esterno verso l’interno con braccio, avambraccio, polso e dita.","Mano opposta pronta a ricevere.","Spinta del piede opposto alla direzione di spostamento.","Controllo con l’altra mano e immediata spinta avanti.","Cambio di velocità."],tactics:"Il cambio frontale omologo è da privilegiare in situazione dinamica e con spazio adeguato fra attaccante e difensore.",errors:["Usarlo senza spazio","Cambio alto","Nessuna accelerazione dopo il controllo"],exam:"Cambio di mano frontale omologo. A cosa serve: Cambiare mano davanti al corpo in situazione dinamica con spazio adeguato fra attaccante e difensore. Tecnica: Testa alta e sguardo sul campo. Palleggio al ginocchio, poi basso sotto le ginocchia. La mano passa da sopra a sopra-laterale. Spinta della palla dall’esterno verso l’interno con braccio, avambraccio, polso e dita. Mano opposta pronta a ricevere. Spinta del piede opposto alla direzione di spostamento. Controllo con l’altra mano e immediata spinta avanti. Cambio di velocità. Tattica: Il cambio frontale omologo è da privilegiare in situazione dinamica e con spazio adeguato fra attaccante e difensore.",cna:!0,source:"Dispensa CNA caricata"},{id:"dietro-schiena",title:"Cambio di mano dietro schiena",area:"Palleggio",icon:"↩",use:"Cambiare mano in situazione dinamica con difensore a contatto.",keys:["Mano da avanti a laterale-dietro","Spinta diagonale dietro la schiena","Cambio di mano e di velocità"],technique:["Testa alta e sguardo sul campo.","La mano passa da avanti a laterale-dietro.","Spinta della palla da dietro in diagonale sul lato opposto.","Cambio di mano.","Cambio di velocità."],tactics:"Si usa quando lo spazio fra palleggiatore e difensore è minimo, con difensore a contatto, in situazione dinamica.",errors:["Usarlo con ampio spazio senza necessità","Spinta non diagonale","Nessun cambio di velocità"],exam:"Cambio di mano dietro schiena. A cosa serve: Cambiare mano in situazione dinamica con difensore a contatto. Tecnica: Testa alta e sguardo sul campo. La mano passa da avanti a laterale-dietro. Spinta della palla da dietro in diagonale sul lato opposto. Cambio di mano. Cambio di velocità. Tattica: Si usa quando lo spazio fra palleggiatore e difensore è minimo, con difensore a contatto, in situazione dinamica.",cna:!0,source:"Dispensa CNA caricata"},{id:"sotto-gambe",title:"Cambio di mano sotto le gambe",area:"Palleggio",icon:"⌁",use:"Cambiare mano in assenza di spazio e con grande pressione difensiva.",keys:["Piede lontano dalla palla leggermente avanti","Spinta esterno-interno sotto le gambe","Controllo con l’altra mano e cambio di velocità"],technique:["Testa alta e sguardo sul campo.","Palleggio laterale e controllato al ginocchio.","Piede lontano dalla palla leggermente più avanti.","Mano da sopra a laterale e mano opposta pronta a ricevere.","Spinta esterno-interno sotto le gambe.","Controllo con l’altra mano e spinta avanti.","Cambio di velocità."],tactics:"Si usa in assenza di spazio, con difensore a contatto, in palleggio controllato e sotto grande pressione a metà campo.",errors:["Gambe non predisposte al passaggio","Palla alta","Usarlo senza pressione o lettura"],exam:"Cambio di mano sotto le gambe. A cosa serve: Cambiare mano in assenza di spazio e con grande pressione difensiva. Tecnica: Testa alta e sguardo sul campo. Palleggio laterale e controllato al ginocchio. Piede lontano dalla palla leggermente più avanti. Mano da sopra a laterale e mano opposta pronta a ricevere. Spinta esterno-interno sotto le gambe. Controllo con l’altra mano e spinta avanti. Cambio di velocità. Tattica: Si usa in assenza di spazio, con difensore a contatto, in palleggio controllato e sotto grande pressione a metà campo.",cna:!0,source:"Dispensa CNA caricata"},{id:"virata",title:"Giro in palleggio o virata",area:"Palleggio",icon:"⟳",use:"Superare il difensore diretto quando c’è poco spazio ma non grande pressione di squadra.",keys:["Piede opposto alla mano di palleggio come perno","Giro dorsale e palla tirata nella nuova direzione","Cambio di mano, spinta avanti e cambio di velocità"],technique:["Testa alta e sguardo sul campo.","Mano di palleggio leggermente avanti alla palla.","Piede opposto alla mano di palleggio leggermente avanti come perno.","Baricentro basso e testa che gira per prima.","Piede posteriore nella nuova direzione con giro dorsale.","La stessa mano tira la palla nella nuova direzione.","Cambio di mano, spinta avanti e cambio di velocità."],tactics:"Si usa con pressione del difensore diretto e poco spazio, ma non con grande pressione di squadra perché dietro al giro deve esserci spazio.",errors:["Girare senza vedere lo spazio dietro","Spostare il perno","Usarla contro pressione di squadra"],exam:"Giro in palleggio o virata. A cosa serve: Superare il difensore diretto quando c’è poco spazio ma non grande pressione di squadra. Tecnica: Testa alta e sguardo sul campo. Mano di palleggio leggermente avanti alla palla. Piede opposto alla mano di palleggio leggermente avanti come perno. Baricentro basso e testa che gira per prima. Piede posteriore nella nuova direzione con giro dorsale. La stessa mano tira la palla nella nuova direzione. Cambio di mano, spinta avanti e cambio di velocità. Tattica: Si usa con pressione del difensore diretto e poco spazio, ma non con grande pressione di squadra perché dietro al giro deve esserci spazio.",cna:!0,source:"Dispensa CNA caricata"},{id:"hesitation",title:"Hesitation",area:"Palleggio",icon:"⏸",use:"Mandare fuori equilibrio il difensore in situazione dinamica e attaccare lo spazio vantaggioso.",keys:["Palleggio veloce e finta di arresto","Spalle alte ma gambe piegate pronte","Ripartenza con cambio di velocità"],technique:["Testa alta e sguardo sul campo.","Palleggio in velocità con finta di arresto.","Spalle che si alzano, baricentro basso e gambe piegate.","Palleggio leggermente più lento e più alto, anche sopra la cintola.","Ripartenza con cambio di velocità.","Possibile cambio di mano oppure prosecuzione con la stessa."],tactics:"Si usa con spazio, in situazione dinamica, soprattutto in contropiede, leggendo durante l’hesitation lo spazio vantaggioso.",errors:["Finta non credibile","Gambe non pronte alla ripartenza","Nessuna lettura dello spazio"],exam:"Hesitation. A cosa serve: Mandare fuori equilibrio il difensore in situazione dinamica e attaccare lo spazio vantaggioso. Tecnica: Testa alta e sguardo sul campo. Palleggio in velocità con finta di arresto. Spalle che si alzano, baricentro basso e gambe piegate. Palleggio leggermente più lento e più alto, anche sopra la cintola. Ripartenza con cambio di velocità. Possibile cambio di mano oppure prosecuzione con la stessa. Tattica: Si usa con spazio, in situazione dinamica, soprattutto in contropiede, leggendo durante l’hesitation lo spazio vantaggioso.",cna:!0,source:"Dispensa CNA caricata"},{id:"hockey-dribbling",title:"Hockey dribbling",area:"Palleggio",icon:"⌇",use:"Mandare fuori equilibrio un difensore posto a distanza incerta.",keys:["Movimento simile all’hesitation","Variazione del ritmo di palleggio e piedi","Ripartenza con cambio di velocità"],technique:["Movimento simile all’hesitation.","Variazione del ritmo del palleggio.","Variazione del movimento dei piedi.","Ripartenza con cambio di velocità.","Possibilità di cambiare mano o continuare con la stessa."],tactics:"Si usa quando il difensore è a una distanza incerta per mandarlo fuori equilibrio.",errors:["Ritmo uniforme","Piedi e palleggio non coordinati","Nessuna accelerazione dopo lo sbilanciamento"],exam:"Hockey dribbling. A cosa serve: Mandare fuori equilibrio un difensore posto a distanza incerta. Tecnica: Movimento simile all’hesitation. Variazione del ritmo del palleggio. Variazione del movimento dei piedi. Ripartenza con cambio di velocità. Possibilità di cambiare mano o continuare con la stessa. Tattica: Si usa quando il difensore è a una distanza incerta per mandarlo fuori equilibrio.",cna:!0,source:"Dispensa CNA caricata"},{id:"finta-cambio",title:"Finta di cambio di mano",area:"Palleggio",icon:"≈",use:"Mandare fuori equilibrio l’avversario in campo aperto e batterlo nello spazio liberato.",keys:["Mano sulla parte esterna e finta di spinta","Corpo simile al cambio, baricentro basso","Mano sulla parte interna, spinta avanti-laterale e accelerazione"],technique:["Testa alta e sguardo sul campo.","Mano sulla parte esterna della palla.","Finta di spinta per cambiare mano e movimento del corpo simile al cambio.","Baricentro basso.","La mano accarezza la palla e ruota sulla parte interna.","Spinta forte avanti-laterale.","Cambio di velocità."],tactics:"Si usa in presenza di spazio, di solito in campo aperto, per mettere fuori equilibrio l’avversario e batterlo nello spazio lasciato libero.",errors:["Finta non credibile","Mano sotto la palla","Mancanza di spinta avanti e cambio di velocità"],exam:"Finta di cambio di mano. A cosa serve: Mandare fuori equilibrio l’avversario in campo aperto e batterlo nello spazio liberato. Tecnica: Testa alta e sguardo sul campo. Mano sulla parte esterna della palla. Finta di spinta per cambiare mano e movimento del corpo simile al cambio. Baricentro basso. La mano accarezza la palla e ruota sulla parte interna. Spinta forte avanti-laterale. Cambio di velocità. Tattica: Si usa in presenza di spazio, di solito in campo aperto, per mettere fuori equilibrio l’avversario e batterlo nello spazio lasciato libero.",cna:!0,source:"Dispensa CNA caricata"},{id:"partenza-inc",title:"Partenza incrociata",area:"Partenze",icon:"⤢",use:"Battere il difensore attaccando lo spazio con il piede opposto alla direzione.",keys:["Palla e piede partono insieme","Passo incrociato oltre il difensore","Spalla bassa e accelerazione"],technique:["Il piede opposto incrocia davanti al corpo.","La palla viene messa a terra prima che il perno si sollevi.","Il primo passo conquista spazio utile."],tactics:"È efficace quando il difensore è vicino e occorre proteggere la palla con il corpo.",errors:["Alzare il perno prima del palleggio","Primo passo laterale","Palla esposta"],exam:"Partenza incrociata: Battere il difensore attaccando lo spazio con il piede opposto alla direzione. Gli elementi tecnici essenziali sono: Il piede opposto incrocia davanti al corpo. La palla viene messa a terra prima che il perno si sollevi. Il primo passo conquista spazio utile. Dal punto di vista tattico, è efficace quando il difensore è vicino e occorre proteggere la palla con il corpo."},{id:"partenza-omo",title:"Partenza omologa",area:"Partenze",icon:"⤡",use:"Attaccare rapidamente lo spazio sullo stesso lato del piede di partenza.",keys:["Piede omologo nella direzione","Palla a terra nel tempo corretto","Accelerazione nello spazio"],technique:["Il piede dello stesso lato apre la traiettoria.","Il palleggio precede il distacco del piede perno.","Corpo e palla avanzano protetti."],tactics:"Si privilegia quando lo spazio è maggiore e la pressione del difensore consente l’uscita diretta.",errors:["Infrazione di passi","Passo corto senza vantaggio","Nessun cambio di velocità"],exam:"Partenza omologa: Attaccare rapidamente lo spazio sullo stesso lato del piede di partenza. Gli elementi tecnici essenziali sono: Il piede dello stesso lato apre la traiettoria. Il palleggio precede il distacco del piede perno. Corpo e palla avanzano protetti. Dal punto di vista tattico, si privilegia quando lo spazio è maggiore e la pressione del difensore consente l’uscita diretta."},{id:"perno",title:"Piede perno e giro",area:"Senza palla",icon:"↻",use:"Proteggere la palla e cambiare orientamento senza commettere passi.",keys:["Perno stabile","Passi brevi con il piede libero","Palla protetta e testa alta"],technique:["Il piede perno mantiene il contatto con il terreno.","Il corpo ruota in equilibrio.","La palla resta lontana dalla pressione difensiva."],tactics:"Serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso.",errors:["Spostare il perno","Ruotare senza vedere il campo","Esporre la palla"],exam:"Piede perno e giro: Proteggere la palla e cambiare orientamento senza commettere passi. Gli elementi tecnici essenziali sono: Il piede perno mantiene il contatto con il terreno. Il corpo ruota in equilibrio. La palla resta lontana dalla pressione difensiva. Dal punto di vista tattico, serve a creare una linea di passaggio, tiro o partenza e a proteggere il possesso."},{id:"passaggio",title:"Passaggio",area:"Attacco",icon:"⇢",use:"Mantenere il vantaggio facendo arrivare la palla al punto giusto nel momento giusto.",keys:["Leggere la linea di passaggio aperta","Scegliere il tipo di passaggio coerente","Coordinare passatore e ricevente"],technique:["Il passaggio coinvolge passatore e ricevente.","La scelta tecnica dipende dalla linea di passaggio aperta.","La palla deve arrivare al punto giusto.","La palla deve arrivare nel momento giusto."],tactics:"L’obiettivo CNA del passaggio è mantenere il vantaggio.",errors:["Passaggio senza lettura della linea","Palla nel punto o tempo sbagliato","Tecnica non coerente con lo spazio lasciato dalla difesa"],exam:"Passaggio. A cosa serve: Mantenere il vantaggio facendo arrivare la palla al punto giusto nel momento giusto. Tecnica: Il passaggio coinvolge passatore e ricevente. La scelta tecnica dipende dalla linea di passaggio aperta. La palla deve arrivare al punto giusto. La palla deve arrivare nel momento giusto. Tattica: L’obiettivo CNA del passaggio è mantenere il vantaggio.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-petto",title:"Passaggio due mani dal petto",area:"Passaggio",icon:"⇉",use:"Servire il compagno sulla linea aperta che parte dal petto.",keys:["Mani dietro la palla e gomiti naturalmente stretti","Spinta di gambe, braccia e polsi","Frustata di pollici, indici e medi con passo avanti"],technique:["Posizione fondamentale, mani dietro la palla e palla davanti al petto.","Gomiti naturalmente stretti sotto la palla.","Spinta delle gambe e delle braccia.","Rotazione esterna dei polsi e frustata delle mani.","Frustata finale di pollice, indice e medio.","Passo nella direzione del passaggio."],tactics:"Si usa quando la linea aperta parte dal petto, soprattutto in contropiede e contro la zona.",errors:["Gomiti larghi","Mancanza della frustata finale","Passo non diretto al ricevente"],exam:"Passaggio due mani dal petto. A cosa serve: Servire il compagno sulla linea aperta che parte dal petto. Tecnica: Posizione fondamentale, mani dietro la palla e palla davanti al petto. Gomiti naturalmente stretti sotto la palla. Spinta delle gambe e delle braccia. Rotazione esterna dei polsi e frustata delle mani. Frustata finale di pollice, indice e medio. Passo nella direzione del passaggio. Tattica: Si usa quando la linea aperta parte dal petto, soprattutto in contropiede e contro la zona.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-schiacciato",title:"Passaggio due mani schiacciato",area:"Passaggio",icon:"↘",use:"Utilizzare la linea bassa quando quella aerea non è aperta.",keys:["Palla dalla cintola","Spinta diretta verso il basso","Rimbalzo a circa due terzi della distanza"],technique:["Tecnica simile al passaggio a due mani diretto.","Palla che parte dall’altezza della cintola.","Spinta diretta verso il basso.","La palla tocca terra a circa due terzi fra passatore e ricevente."],tactics:"Si usa in presenza di spazio, con difensore non a contatto, quando la linea aerea non è aperta.",errors:["Rimbalzo troppo vicino al passatore","Usarlo col difensore a contatto","Traiettoria alta o lenta"],exam:"Passaggio due mani schiacciato. A cosa serve: Utilizzare la linea bassa quando quella aerea non è aperta. Tecnica: Tecnica simile al passaggio a due mani diretto. Palla che parte dall’altezza della cintola. Spinta diretta verso il basso. La palla tocca terra a circa due terzi fra passatore e ricevente. Tattica: Si usa in presenza di spazio, con difensore non a contatto, quando la linea aerea non è aperta.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-testa",title:"Passaggio sopra la testa",area:"Passaggio",icon:"⇈",use:"Servire il compagno quando la linea aperta è sopra la testa o sopra le spalle.",keys:["Palla sopra la fronte e gomiti sotto","Distensione verso il ricevente","Spinta di polsi e mani con piccolo passo"],technique:["Palla sopra la fronte.","Gomiti sotto la palla.","Distensione delle braccia verso il ricevente.","Spinta di polsi e mani.","Piccolo passo verso il ricevente."],tactics:"Si usa sulla linea alta: uscita da blocco, ribaltamento dal post basso, skip pass o apertura dopo rimbalzo.",errors:["Palla dietro la testa","Gomiti fuori linea","Passaggio senza passo o direzione"],exam:"Passaggio sopra la testa. A cosa serve: Servire il compagno quando la linea aperta è sopra la testa o sopra le spalle. Tecnica: Palla sopra la fronte. Gomiti sotto la palla. Distensione delle braccia verso il ricevente. Spinta di polsi e mani. Piccolo passo verso il ricevente. Tattica: Si usa sulla linea alta: uscita da blocco, ribaltamento dal post basso, skip pass o apertura dopo rimbalzo.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-laterale",title:"Passaggio laterale a una o due mani",area:"Passaggio",icon:"↝",use:"Utilizzare lo spazio vantaggioso laterale al difensore.",keys:["Palla lateralmente con mano di spinta dietro","Passo laterale per allargare lo spazio","Distensione e frustata di polso e dita"],technique:["Palla portata lateralmente con mano di spinta dietro e mano guida laterale.","Passo laterale per allargare lo spazio di azione.","Distensione degli arti.","Frustata finale di polso e dita.","La mano di spinta termina con dita verso terra; la guida col palmo verso la mano di spinta."],tactics:"Si usa quando lo spazio vantaggioso è laterale, diretto o battuto a terra, soprattutto per post basso o taglio.",errors:["Sbilanciarsi nel passo laterale","Mano di spinta non dietro la palla","Non leggere se la linea è diretta o schiacciata"],exam:"Passaggio laterale a una o due mani. A cosa serve: Utilizzare lo spazio vantaggioso laterale al difensore. Tecnica: Palla portata lateralmente con mano di spinta dietro e mano guida laterale. Passo laterale per allargare lo spazio di azione. Distensione degli arti. Frustata finale di polso e dita. La mano di spinta termina con dita verso terra; la guida col palmo verso la mano di spinta. Tattica: Si usa quando lo spazio vantaggioso è laterale, diretto o battuto a terra, soprattutto per post basso o taglio.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-consegnato",title:"Passaggio consegnato",area:"Passaggio",icon:"⇄",use:"Mantenere o aumentare un vantaggio in spazi ridotti con un compagno pressato o anticipato.",keys:["Mezzo giro dorsale per proteggere","Una mano sopra e una sotto la palla","Ricevente laterale e protezione con corpo e braccio"],technique:["Posizione fondamentale.","Mezzo giro dorsale del passatore per proteggere la palla.","Una mano sopra e una sotto; quella sopra è sul lato del ricevente.","Il ricevente prende la palla lateralmente.","Protezione con corpo e braccio dalla spalla al gomito."],tactics:"Si usa in spazi ridotti quando il compagno pressato o anticipato legge il vantaggio verso il passatore e riceve con movimento aggressivo.",errors:["Consegnare frontalmente senza protezione","Mani disposte in modo errato","Ricevente lontano o passivo"],exam:"Passaggio consegnato. A cosa serve: Mantenere o aumentare un vantaggio in spazi ridotti con un compagno pressato o anticipato. Tecnica: Posizione fondamentale. Mezzo giro dorsale del passatore per proteggere la palla. Una mano sopra e una sotto; quella sopra è sul lato del ricevente. Il ricevente prende la palla lateralmente. Protezione con corpo e braccio dalla spalla al gomito. Tattica: Si usa in spazi ridotti quando il compagno pressato o anticipato legge il vantaggio verso il passatore e riceve con movimento aggressivo.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-baseball",title:"Passaggio baseball",area:"Passaggio",icon:"➶",use:"Coprire spazi lunghi in tempi brevi.",keys:["Palla vicino all’orecchio e peso sul piede posteriore","Torsione del busto, mano dietro e gomito sotto","Distensione completa, frustata e passo avanti"],technique:["Posizione fondamentale e palla vicino all’orecchio con entrambe le mani.","Peso sul piede posteriore e torsione del busto.","Mano di spinta dietro, guida laterale e gomito sotto la palla.","Distensione di ginocchia, schiena e braccia.","Frustata finale di polso e dita.","Passo avanti seguendo il passaggio."],tactics:"Si usa per coprire spazi lunghi in tempi brevi, tipicamente in contropiede.",errors:["Usare solo il braccio","Gomito non sotto la palla","Traiettoria lenta che non ruba tempo"],exam:"Passaggio baseball. A cosa serve: Coprire spazi lunghi in tempi brevi. Tecnica: Posizione fondamentale e palla vicino all’orecchio con entrambe le mani. Peso sul piede posteriore e torsione del busto. Mano di spinta dietro, guida laterale e gomito sotto la palla. Distensione di ginocchia, schiena e braccia. Frustata finale di polso e dita. Passo avanti seguendo il passaggio. Tattica: Si usa per coprire spazi lunghi in tempi brevi, tipicamente in contropiede.",cna:!0,source:"Dispensa CNA caricata"},{id:"pass-palleggio",title:"Passaggio da palleggio",area:"Passaggio",icon:"➠",use:"Rubare tempo al difensore passando direttamente dal palleggio.",keys:["Mano da sopra a dietro la palla","Distensione del braccio","Frustata di polso e dita verso il ricevente"],technique:["La mano di palleggio passa da sopra a dietro la palla.","Distensione del braccio.","Frustata finale di polso e dita verso il ricevente.","Passo verso il ricevente."],tactics:"Si usa quando la linea aperta va dall’anca alla spalla del difensore e si vuole rubare tempo, per esempio sul back-door.",errors:["Raccogliere inutilmente la palla","Mano non dietro la palla","Passaggio senza passo verso il ricevente"],exam:"Passaggio da palleggio. A cosa serve: Rubare tempo al difensore passando direttamente dal palleggio. Tecnica: La mano di palleggio passa da sopra a dietro la palla. Distensione del braccio. Frustata finale di polso e dita verso il ricevente. Passo verso il ricevente. Tattica: Si usa quando la linea aperta va dall’anca alla spalla del difensore e si vuole rubare tempo, per esempio sul back-door.",cna:!0,source:"Dispensa CNA caricata"},{id:"finte",title:"Finte con e senza palla",area:"Attacco",icon:"≈",use:"Mandare fuori equilibrio il difensore e aprire linee di passaggio più vantaggiose.",keys:["Tempo corretto","Intensità corretta","Leggere la reazione del difensore"],technique:["La finta deve essere eseguita nel tempo giusto.","L’intensità deve essere sufficiente a provocare una reazione.","La finta non deve essere né troppo veloce né eccessivamente lenta."],tactics:"Serve a mandare fuori equilibrio il difensore e aprire linee di passaggio vantaggiose.",errors:["Finta troppo veloce che non concede tempo di reazione","Finta eccessivamente lenta","Nessun utilizzo della linea aperta"],exam:"Finte con e senza palla. A cosa serve: Mandare fuori equilibrio il difensore e aprire linee di passaggio più vantaggiose. Tecnica: La finta deve essere eseguita nel tempo giusto. L’intensità deve essere sufficiente a provocare una reazione. La finta non deve essere né troppo veloce né eccessivamente lenta. Tattica: Serve a mandare fuori equilibrio il difensore e aprire linee di passaggio vantaggiose.",cna:!0,source:"Dispensa CNA caricata"},{id:"tiro",title:"Tiro",area:"Attacco",icon:"⌁",use:"Concretizzare il vantaggio.",keys:["Presa con pollici a T e palla sui polpastrelli","Tecnica adattata al giocatore","Scelta del tipo di tiro in funzione di spazio e difesa"],technique:["Palla presa con pollici a T.","Mani naturalmente distese e allargate.","Palla tenuta sui polpastrelli.","La tecnica deve essere adattata al giocatore."],tactics:"Il tiro concretizza il vantaggio; la forma scelta dipende da spazio, tempo, forza e difensore.",errors:["Palla sul palmo","Tecnica non adattata al giocatore","Tiro senza aver riconosciuto il vantaggio"],exam:"Tiro. A cosa serve: Concretizzare il vantaggio. Tecnica: Palla presa con pollici a T. Mani naturalmente distese e allargate. Palla tenuta sui polpastrelli. La tecnica deve essere adattata al giocatore. Tattica: Il tiro concretizza il vantaggio; la forma scelta dipende da spazio, tempo, forza e difensore.",cna:!0,source:"Dispensa CNA caricata"},{id:"tiro-fermo",title:"Tiro da fermo",area:"Tiro",icon:"⌂",use:"Costruire la tecnica di tiro e concludere da tiro libero.",keys:["Allineamenti e mano di tiro sotto la palla","Distensione dal basso verso l’alto","Frustata dopo la distensione e rilascio con indice"],technique:["Testa alta, occhi al canestro, piedi al bacino e piede della mano di tiro leggermente avanti.","Peso sugli avampiedi, caviglie e gambe piegate, busto leggermente avanti.","Allineamento spalla-ginocchio-punta del piede e indice-gomito-spalla-ginocchio-piede.","Mano di tiro sotto la palla sui polpastrelli, guida laterale e gomito sotto.","Distensione di caviglie, gambe, schiena, spalle e braccia.","Frustata del polso solo dopo la distensione delle braccia e rilascio con indice.","Chiusura con braccia distese, palmo di tiro in basso e guida verso l’interno."],tactics:"Il tiro piazzato si usa nell’insegnamento e nel tiro libero.",errors:["Frustata prima della distensione","Mano guida che spinge","Perdita degli allineamenti"],exam:"Tiro da fermo. A cosa serve: Costruire la tecnica di tiro e concludere da tiro libero. Tecnica: Testa alta, occhi al canestro, piedi al bacino e piede della mano di tiro leggermente avanti. Peso sugli avampiedi, caviglie e gambe piegate, busto leggermente avanti. Allineamento spalla-ginocchio-punta del piede e indice-gomito-spalla-ginocchio-piede. Mano di tiro sotto la palla sui polpastrelli, guida laterale e gomito sotto. Distensione di caviglie, gambe, schiena, spalle e braccia. Frustata del polso solo dopo la distensione delle braccia e rilascio con indice. Chiusura con braccia distese, palmo di tiro in basso e guida verso l’interno. Tattica: Il tiro piazzato si usa nell’insegnamento e nel tiro libero.",cna:!0,source:"Dispensa CNA caricata"},{id:"tiro-elevazione",title:"Tiro in elevazione",area:"Tiro",icon:"⇧",use:"Tirare mentre si salta, prendendo in controtempo il difensore o compensando una carenza di forza.",keys:["Preparazione uguale al tiro da fermo","Distensione coordinata durante il salto","Si tira mentre si salta"],technique:["Preparazione e allineamenti uguali al tiro da fermo.","Distensione di caviglie, gambe, schiena e spalle.","Distensione delle braccia e del polso.","Frustata solo a braccia distese e rilascio con indice.","Mano guida accompagna col palmo verso l’interno.","Chiusura con braccia distese e palmo della mano di tiro verso il basso."],tactics:"Si tira mentre si salta: per prendere in controtempo il difensore che sta per saltare o in caso di carenza di forza.",errors:["Confonderlo col tiro in sospensione","Rilascio troppo tardi","Perdita della catena di distensione"],exam:"Tiro in elevazione. A cosa serve: Tirare mentre si salta, prendendo in controtempo il difensore o compensando una carenza di forza. Tecnica: Preparazione e allineamenti uguali al tiro da fermo. Distensione di caviglie, gambe, schiena e spalle. Distensione delle braccia e del polso. Frustata solo a braccia distese e rilascio con indice. Mano guida accompagna col palmo verso l’interno. Chiusura con braccia distese e palmo della mano di tiro verso il basso. Tattica: Si tira mentre si salta: per prendere in controtempo il difensore che sta per saltare o in caso di carenza di forza.",cna:!0,source:"Dispensa CNA caricata"},{id:"tiro-sospensione",title:"Tiro in sospensione",area:"Tiro",icon:"⇡",use:"Tirare sopra le braccia e le mani del difensore.",keys:["Spinta massima per saltare","Rilascio un attimo prima della massima sospensione","Ricaduta nel punto di stacco o poco avanti"],technique:["Preparazione e allineamenti uguali al tiro da fermo.","Spinta massima di caviglie, gambe, schiena e spalle.","Distensione delle braccia e frustata alla fine della distensione.","Rilascio con indice un attimo prima della massima sospensione.","Mano guida accompagna fino al rilascio.","Ricaduta nel punto di stacco o leggermente più avanti."],tactics:"Si usa per tirare sopra le braccia e le mani del difensore.",errors:["Rilasciare mentre si sale come nel tiro in elevazione","Rilascio in discesa","Ricaduta lontana dal punto di stacco"],exam:"Tiro in sospensione. A cosa serve: Tirare sopra le braccia e le mani del difensore. Tecnica: Preparazione e allineamenti uguali al tiro da fermo. Spinta massima di caviglie, gambe, schiena e spalle. Distensione delle braccia e frustata alla fine della distensione. Rilascio con indice un attimo prima della massima sospensione. Mano guida accompagna fino al rilascio. Ricaduta nel punto di stacco o leggermente più avanti. Tattica: Si usa per tirare sopra le braccia e le mani del difensore.",cna:!0,source:"Dispensa CNA caricata"},{id:"uncino",title:"Tiro ad uncino / semigancio",area:"Tiro",icon:"◔",use:"Concludere in spazi ristretti contro giocatori alti facendo partire la palla lontano dal difensore.",keys:["Passo col piede opposto alla mano di tiro","Palla lontana dal difensore e vicino all’orecchio","Distensione del braccio e frustata di polso e dita"],technique:["Preparazione con schiena a canestro, palla a due mani e posizione fondamentale.","Passo verso canestro col piede opposto alla mano di tiro.","La mano di tiro passa sotto la palla; la guida resta laterale.","Palla lontana dal difensore e vicino all’orecchio.","Spalla opposta alla mano di tiro perpendicolare al petto del difensore.","Distensione del braccio e frustata di polso e dita.","La guida accompagna fino al rilascio.","Chiusura con palmo di tiro verso il suolo, braccia alte e caduta in equilibrio verso canestro."],tactics:"Si usa in spazi ristretti contro giocatori alti, usando il corpo per proteggere e far partire la palla lontana dal difensore.",errors:["Passo con il piede omologo","Palla davanti o vicina al difensore","Caduta fuori equilibrio"],exam:"Tiro ad uncino / semigancio. A cosa serve: Concludere in spazi ristretti contro giocatori alti facendo partire la palla lontano dal difensore. Tecnica: Preparazione con schiena a canestro, palla a due mani e posizione fondamentale. Passo verso canestro col piede opposto alla mano di tiro. La mano di tiro passa sotto la palla; la guida resta laterale. Palla lontana dal difensore e vicino all’orecchio. Spalla opposta alla mano di tiro perpendicolare al petto del difensore. Distensione del braccio e frustata di polso e dita. La guida accompagna fino al rilascio. Chiusura con palmo di tiro verso il suolo, braccia alte e caduta in equilibrio verso canestro. Tattica: Si usa in spazi ristretti contro giocatori alti, usando il corpo per proteggere e far partire la palla lontana dal difensore.",cna:!0,source:"Dispensa CNA caricata"},{id:"terzo-tempo",title:"Tiro in corsa: terzo tempo",area:"Tiro in corsa",icon:"①",use:"Concludere in corsa con due appoggi quando esiste spazio in avvicinamento a canestro.",keys:["Primo appoggio omologo alla mano di tiro","Secondo appoggio opposto e spinta verso l’alto","Rilascio al punto più alto e ricaduta in equilibrio"],technique:["Presa con polso carico e palla vicina al corpo lontana dal difensore.","Primo appoggio col piede omologo alla mano di tiro e spinta avanti.","Secondo appoggio col piede opposto con rullata tallone-avampiede.","Spinta verso l’alto col ginocchio lato mano di tiro che sale.","Pallone portato in alto e mani come nel tiro piazzato.","Rilascio al punto più alto, guida fino in fondo e ricaduta in equilibrio."],tactics:"Il terzo tempo si usa in presenza di spazio in avvicinamento verso canestro.",errors:["Invertire la sequenza degli appoggi","Tenere la palla vicina al difensore","Spinta solo in avanti e non verso l’alto"],exam:"Tiro in corsa: terzo tempo. A cosa serve: Concludere in corsa con due appoggi quando esiste spazio in avvicinamento a canestro. Tecnica: Presa con polso carico e palla vicina al corpo lontana dal difensore. Primo appoggio col piede omologo alla mano di tiro e spinta avanti. Secondo appoggio col piede opposto con rullata tallone-avampiede. Spinta verso l’alto col ginocchio lato mano di tiro che sale. Pallone portato in alto e mani come nel tiro piazzato. Rilascio al punto più alto, guida fino in fondo e ricaduta in equilibrio. Tattica: Il terzo tempo si usa in presenza di spazio in avvicinamento verso canestro.",cna:!0,source:"Dispensa CNA caricata"},{id:"secondo-tempo",title:"Tiro in corsa: secondo tempo",area:"Tiro in corsa",icon:"②",use:"Rubare tempo al difensore o allontanarsi dopo averlo battuto quando lo spazio è ridotto.",keys:["Presa lontana dal difensore","Un appoggio di norma opposto alla mano di tiro","Spinta in alto, frustata e ricaduta in equilibrio"],technique:["Presa della palla lontano dal difensore.","Appoggio col piede opposto alla mano di tiro; con grande coordinazione può essere omologo.","Spinta verso l’alto e pallone portato in alto.","Presa come nel tiro piazzato.","Distensione di braccio, polso e dita con frustata finale.","Mano guida fino in fondo e ricaduta in equilibrio."],tactics:"Si usa con poco spazio per rubare tempo al difensore o allontanarsi da lui dopo averlo battuto.",errors:["Usare due appoggi","Palla vicina al difensore","Ricaduta senza equilibrio"],exam:"Tiro in corsa: secondo tempo. A cosa serve: Rubare tempo al difensore o allontanarsi dopo averlo battuto quando lo spazio è ridotto. Tecnica: Presa della palla lontano dal difensore. Appoggio col piede opposto alla mano di tiro; con grande coordinazione può essere omologo. Spinta verso l’alto e pallone portato in alto. Presa come nel tiro piazzato. Distensione di braccio, polso e dita con frustata finale. Mano guida fino in fondo e ricaduta in equilibrio. Tattica: Si usa con poco spazio per rubare tempo al difensore o allontanarsi da lui dopo averlo battuto.",cna:!0,source:"Dispensa CNA caricata"},{id:"postulati",title:"Postulati: spazio, tempo, equilibrio, autonomia",area:"Concetti",icon:"✦",use:"Leggere il gioco attraverso i riferimenti fondamentali che guidano tecnica e decisioni.",keys:["Spazio utile","Tempo corretto","Equilibrio e autonomia"],technique:["Ogni gesto tecnico è adattato allo spazio disponibile.","La scelta deve avvenire nel tempo che il gioco concede.","Equilibrio permette di eseguire e autonomia permette di decidere."],tactics:"I postulati collegano fondamentali tecnici e tattici: guardare, parlare, ascoltare e toccare.",errors:["Insegnare gesti senza situazione","Ignorare tempo e distanza","Dare soluzioni senza responsabilità al giocatore"],exam:"Postulati: spazio, tempo, equilibrio, autonomia: Leggere il gioco attraverso i riferimenti fondamentali che guidano tecnica e decisioni. Gli elementi tecnici essenziali sono: Ogni gesto tecnico è adattato allo spazio disponibile. La scelta deve avvenire nel tempo che il gioco concede. Equilibrio permette di eseguire e autonomia permette di decidere. Dal punto di vista tattico, i postulati collegano fondamentali tecnici e tattici: guardare, parlare, ascoltare e toccare."},{id:"vantaggio",title:"Creare, mantenere e concretizzare il vantaggio",area:"Concetti",icon:"＋",use:"Organizzare ogni azione offensiva e difensiva attorno al vantaggio.",keys:["Creare spazio o tempo","Mantenere con scelta e collaborazione","Concretizzare con tiro ad alta percentuale"],technique:["Il vantaggio nasce quando un difensore è battuto o impegnato.","Passaggio, palleggio e movimento mantengono il vantaggio.","La conclusione corretta lo trasforma in un risultato."],tactics:"In difesa l’obiettivo opposto è togliere il vantaggio, recuperare la palla o forzare un tiro difficile.",errors:["Confondere velocità con vantaggio","Fermare la palla","Concludere senza equilibrio"],exam:"Creare, mantenere e concretizzare il vantaggio: Organizzare ogni azione offensiva e difensiva attorno al vantaggio. Gli elementi tecnici essenziali sono: Il vantaggio nasce quando un difensore è battuto o impegnato. Passaggio, palleggio e movimento mantengono il vantaggio. La conclusione corretta lo trasforma in un risultato. Dal punto di vista tattico, in difesa l’obiettivo opposto è togliere il vantaggio, recuperare la palla o forzare un tiro difficile."},{id:"progressione",title:"Progressione didattica",area:"Metodologia",icon:"▤",use:"Portare il giocatore dal gesto semplice alla lettura e al gioco reale.",keys:["Dal semplice al complesso","Dall’1c0 alla presenza difensiva","Trasferimento in situazione agonistica"],technique:["Si definisce un obiettivo osservabile.","Si costruiscono esercizi coerenti e progressivi.","Regole e difficoltà aumentano senza perdere l’obiettivo."],tactics:"La progressione efficace comprende attivazione, fase cognitiva e agonistica, correzione e verifica.",errors:["Esercizi scollegati","Troppe correzioni insieme","Regole che cambiano l’obiettivo"],exam:"Progressione didattica: Portare il giocatore dal gesto semplice alla lettura e al gioco reale. Gli elementi tecnici essenziali sono: Si definisce un obiettivo osservabile. Si costruiscono esercizi coerenti e progressivi. Regole e difficoltà aumentano senza perdere l’obiettivo. Dal punto di vista tattico, la progressione efficace comprende attivazione, fase cognitiva e agonistica, correzione e verifica."},{id:"osservazione",title:"Osservazione e correzione",area:"Metodologia",icon:"◎",use:"Vedere ciò che accade realmente e intervenire sull’errore prioritario.",keys:["Osservare rispetto all’obiettivo","Scegliere cosa correggere","Verificare l’effetto della correzione"],technique:["L’allenatore definisce indicatori concreti.","Può correggere direttamente o porre domande.","Lascia tempo al giocatore per adattare la risposta."],tactics:"La correzione deve far crescere il singolo e la squadra, senza interrompere inutilmente il gioco.",errors:["Correggere tutto","Osservare la palla soltanto","Dare soluzioni senza domande"],exam:"Osservazione e correzione: Vedere ciò che accade realmente e intervenire sull’errore prioritario. Gli elementi tecnici essenziali sono: L’allenatore definisce indicatori concreti. Può correggere direttamente o porre domande. Lascia tempo al giocatore per adattare la risposta. Dal punto di vista tattico, la correzione deve far crescere il singolo e la squadra, senza interrompere inutilmente il gioco."}],sections:["Fondamentali senza palla","Fondamentali difensivi","Fondamentali offensivi con palla","Concetti e metodo"],diagrams:[{title:"Passa e taglia",players:[["1",22,78,!0],["2",74,42,!1],["X1",27,66,!1],["X2",67,36,!1]],arrows:[["pass",28,70,49,-28],["move",30,69,45,-63]],steps:["1 passa la palla a 2 sul lato.","Subito dopo 1 taglia deciso davanti a X1 verso canestro.","2 legge X2 e l’aiuto: passa sul taglio oppure mantiene il vantaggio."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Taglio back-door",players:[["1",23,66,!0],["2",74,48,!1],["X2",65,45,!1]],arrows:[["move",71,52,39,130],["pass",29,63,47,9]],steps:["2 finta di venire incontro e porta X2 sulla linea di passaggio.","Quando X2 anticipa, 2 cambia velocità e taglia dietro.","1 passa nello spazio davanti al taglio, non addosso al compagno."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Dai e vai",players:[["1",21,76,!0],["2",75,45,!1],["X1",29,67,!1],["X2",68,39,!1]],arrows:[["pass",27,69,50,-27],["move",31,67,44,-61],["pass",69,43,35,142]],steps:["1 passa a 2 e non resta fermo.","1 batte X1 con cambio di velocità e taglia a canestro.","2 restituisce nel tempo utile, leggendo X2 e lo spazio interno."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Penetra e scarica",players:[["1",27,78,!0],["2",80,52,!1],["X1",33,66,!1],["X2",58,39,!1]],arrows:[["move",34,70,34,-59],["pass",49,43,34,12]],steps:["1 supera X1 in palleggio e attacca la linea di penetrazione.","X2 lascia il proprio uomo per aiutare.","1 legge l’aiuto e scarica a 2 nello spazio libero."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Aiuto e rotazione",players:[["1",25,76,!0],["2",80,48,!1],["X1",31,66,!1],["X2",54,39,!1],["X3",72,58,!1]],arrows:[["move",32,68,31,-58],["def",56,41,24,25],["def",72,56,24,-78]],steps:["1 penetra verso il centro superando X1.","X2 aiuta fermando la penetrazione sulla linea utile.","X3 ruota verso 2 per proteggere il passaggio successivo."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Passaggio consegnato",players:[["1",38,61,!0],["2",72,61,!1],["X2",66,52,!1]],arrows:[["move",68,60,27,180],["pass",43,59,23,0],["move",48,55,37,-49]],steps:["2 corre vicino a 1 portando con sé X2.","1 protegge e consegna la palla nel punto d’incontro.","2 riceve e attacca subito lo spazio leggendo la posizione di X2."],source:"Rielaborazione didattica dalla dispensa CNA caricata",sourceUrl:"https://cna.fip.it/area-tecnica-test/"},{title:"Penetra, scarica ed extra-pass",players:[["1",24,76,!0],["2",76,52,!1],["3",82,76,!1],["X1",31,66,!1],["X2",57,44,!1],["X3",75,68,!1]],arrows:[["move",31,69,31,-57],["pass",48,45,31,13],["pass",76,55,28,63]],steps:["1 batte X1 e prende vantaggio attaccando la linea di penetrazione.","X2 aiuta: 1 scarica a 2 per mantenere il vantaggio.","X3 ruota su 2: extra-pass immediato a 3 nello spazio liberato per concretizzare."],source:"Rie
