<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNA · 5 parole</title><style>:root{--n:#0f1836;--b:#1f55c5;--c:#35c3d6;--o:#ff6b3d;--bg:#f3f6fb;--g:#16845b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172039}.top{background:var(--n);color:white;padding:20px}.top>*{max-width:1100px;margin:0 auto}.top p{margin-top:7px}.wrap{max-width:1100px;margin:auto;padding:14px}.tools,.card{background:white;border:1px solid #dce2ed;border-radius:14px;padding:14px;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button,.print{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.filters button{background:#e9eef8}.filters button.on{background:var(--b);color:#fff}.print{background:var(--g);color:#fff;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat{font-size:12px;font-weight:bold;color:var(--b);text-transform:uppercase}.card h2{margin:5px 0 10px;color:var(--n)}.words{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.word{background:#e9fafd;border:1px solid #aee9ef;border-radius:999px;padding:7px 10px;font-weight:800}.logic{font-weight:bold;color:var(--o);margin:10px 0}.answer{display:none;background:#f4f6ff;border-left:5px solid var(--b);padding:10px;border-radius:7px;line-height:1.45}.show{border:0;background:var(--n);color:#fff;padding:8px 11px;border-radius:8px;font-weight:bold}.note{font-size:13px;color:#5b657a}.count{font-weight:bold;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.print{margin-left:0}}@media print{body{background:#fff}.top{padding:8px 0;background:#fff;color:#000;border-bottom:2px solid #000}.tools,.show{display:none!important}.wrap{padding:0}.grid{display:block}.card{break-inside:avoid;border:1px solid #777;border-radius:0;margin:0 0 7px;padding:8px}.answer{display:block!important;background:#fff;border-left:3px solid #000;padding:5px}.word{background:#fff;border:1px solid #777;padding:4px 7px}.card h2{font-size:16px;margin:2px 0}.logic{margin:5px 0}.top p{font-size:12px}}</style></head><body><header class="top"><div><h1>🏀 CNA · 5 PAROLE PER RICORDARE</h1><p>Fondamentali · Postulati · Concetti · Tecnica + tattica · memoria rapida per l'esame</p></div></header><main class="wrap"><section class="tools"><div class="filters" id="filters"></div><p class="note">Leggi il termine → prova a ricordare le 5 parole → costruisci la risposta → premi <b>SVILUPPA</b>. In stampa compare anche la risposta completa.</p><div class="count" id="count"></div></section><div class="grid" id="grid"></div></main><script>const D=[
['Fondamentali','Posizione fondamentale','Piedi|Flesso|Equilibrio|Pronto|Sguardo','TECNICA → equilibrio dinamico; TATTICA → essere pronti a reagire.','Piedi attivi, caviglie e ginocchia flesse, baricentro controllato, busto stabile e testa alta: è la base per muoversi rapidamente in ogni direzione.'],
['Fondamentali','Palleggio spinto','Spazio|Avanti|Corsa|Testa|Vantaggio','TECNICA → palla avanti-laterale; TATTICA → attaccare spazio libero.','Si usa quando c’è spazio libero davanti per avanzare rapidamente. La palla è spinta avanti e lateralmente, coordinata con la corsa, mantenendo controllo e testa alta per creare o aumentare vantaggio.'],
['Fondamentali','Palleggio controllo / protezione','Pressione|Corpo|Lontano|Controllo|Testa','TECNICA → palla protetta e vicina; TATTICA → gestire pressione.','Con difensore vicino mantengo la palla sul lato lontano, usando corpo e spalla come protezione senza perdere equilibrio e visione del gioco.'],
['Fondamentali','Cambio di mano frontale','Appoggio|Basso|Laterale|Ricezione|Ripartenza','TECNICA → cambio davanti basso; TATTICA → cambiare linea al difensore.','Carico l’appoggio, abbasso il baricentro, spingo la palla lateralmente davanti al corpo verso la mano opposta e riparto nella nuova direzione.'],
['Fondamentali','Cambio sotto le gambe','Apertura|Basso|Sotto|Ricezione|Ripartenza','TECNICA → passaggio protetto sotto la gamba; TATTICA → cambiare direzione proteggendo palla.','Base adeguata e baricentro basso: la palla passa sotto la gamba verso la mano opposta; ricevo e riparto. Il gesto è utile se nasce dalla lettura del difensore.'],
['Fondamentali','Cambio dietro la schiena','Protezione|Bacino|Dietro|Ricezione|Ripartenza','TECNICA → traiettoria dietro il bacino; TATTICA → cambiare mano proteggendo.','La palla viene indirizzata dietro il bacino verso la mano opposta mantenendo equilibrio e continuità, quindi si riparte nella nuova direzione.'],
['Fondamentali','Cambio di velocità','Ritmo|Rallento|Leggo|Accelero|Vantaggio','TECNICA → modulare frequenza e ampiezza; TATTICA → sorprendere il difensore.','Vario ritmo e velocità del palleggio leggendo il difensore: controllo o rallento, poi accelero nello spazio utile per creare vantaggio.'],
['Fondamentali','Cambio di direzione','Appoggio|Baricentro|Cambio|Spazio|Vantaggio','TECNICA → appoggio e nuova linea; TATTICA → attaccare spazio opposto.','Uso appoggi efficaci e baricentro controllato per modificare la linea di avanzamento in funzione della posizione del difensore e dello spazio disponibile.'],
['Fondamentali','Arresto a un tempo','Due piedi|Contemporanei|Equilibrio|Controllo|Scelta','TECNICA → appoggi simultanei; TATTICA → preparare la scelta successiva.','È definito dal contatto contemporaneo dei due piedi con il terreno. Con possesso di palla, la successiva gestione del perno dipende dalla regola applicabile alla situazione.'],
['Fondamentali','Arresto a due tempi','Successione|Primo|Secondo|Equilibrio|Controllo','TECNICA → appoggi successivi; TATTICA → controllare il corpo in movimento.','È definito da due appoggi che prendono contatto con il terreno in successione. Primo appoggio e piede perno non sono automaticamente sinonimi.'],
['Fondamentali','Partenza omologa','Direzione|Stesso|Libero|Perno|Spinta','TECNICA CNA → parte il piede omologo; REGOLA → rispettare il perno.','Nella didattica tecnica CNA, verso destra muove per primo il destro, verso sinistra il sinistro: è il piede libero; il piede opposto resta perno. La legalità del movimento va sempre distinta dalla descrizione tecnica.'],
['Fondamentali','Partenza incrociata','Direzione|Opposto|Incrocia|Perno|Spinta','TECNICA CNA → parte il piede opposto; REGOLA → rispettare il perno.','Nella didattica tecnica CNA il piede opposto alla direzione si muove per primo e incrocia, mentre l’altro rimane perno.'],
['Fondamentali','Smarcamento','Difensore|Spazio|Tempo|Linea|Vantaggio','TECNICA → appoggi e cambi ritmo/direzione; TATTICA → creare linea di passaggio.','Leggo difensore, palla e spazio per creare una linea di passaggio utile attraverso cambi di direzione e velocità, con l’obiettivo di creare vantaggio.'],
['Fondamentali','Passaggio','Vedere|Linea|Tempo|Precisione|Vantaggio','TECNICA → traiettoria e precisione; TATTICA → servire il compagno nel tempo utile.','Il passaggio collega lettura e collaborazione: vedo compagno, difesa e linea disponibile, scelgo tempo e traiettoria e passo con precisione.'],
['Fondamentali','Ricezione','Mostrare|Mani|Controllo|Equilibrio|Scelta','TECNICA → mani pronte e controllo; TATTICA → ricevere già orientati al gioco.','Preparo mani e corpo, controllo la palla mantenendo equilibrio e visione, così la ricezione permette una scelta immediata successiva.'],
['Fondamentali','Tiro','Equilibrio|Piedi|Spinta|Mano|Bersaglio','TECNICA → catena dal basso verso l’alto; TATTICA → scegliere un tiro utile.','Dagli appoggi nasce una spinta coordinata attraverso gambe, busto, braccio, polso e dita, mantenendo equilibrio e riferimento al bersaglio. La qualità della scelta precede l’esecuzione.'],
['Fondamentali','Perno','Appoggio|Stabilità|Rotazione|Spazio|Protezione','TECNICA → ruotare mantenendo il piede perno; TATTICA → orientarsi e proteggere.','Permette di modificare orientamento mantenendo il piede perno nei limiti regolamentari, proteggendo palla e creando nuove linee di passaggio o attacco.'],
['Fondamentali','Taglio','Spazio|Tempo|Cambio|Canestro|Vantaggio','TECNICA → cambio ritmo/direzione; TATTICA → occupare uno spazio utile.','È un movimento senza palla eseguito leggendo spazio, compagni e difensori, con cambio di ritmo/direzione per creare o mantenere vantaggio.'],
['Postulati','Equilibrio','Piedi|Baricentro|Controllo|Adattamento|Efficacia','POSTULATO → controllare il corpo per rendere efficace ogni azione.','L’equilibrio è dinamico: appoggi e baricentro si adattano continuamente alla situazione per consentire controllo, rapidità e precisione.'],
['Postulati','Spazio','Vedere|Occupare|Creare|Attaccare|Vantaggio','POSTULATO → leggere e utilizzare gli spazi.','Lo spazio va percepito, creato, occupato e attaccato in relazione a palla, compagni e avversari; non è un riferimento statico.'],
['Postulati','Tempo','Leggere|Momento|Anticipare|Sincronizzare|Vantaggio','POSTULATO → fare la cosa utile nel momento utile.','La stessa scelta tecnica cambia efficacia in base al momento: leggere e sincronizzare azioni proprie, compagni e difesa permette di sfruttare il vantaggio.'],
['Postulati','Autonomia','Leggere|Scegliere|Decidere|Eseguire|Responsabilità','POSTULATO → rendere il giocatore capace di decidere.','L’obiettivo formativo non è riprodurre ordini, ma sviluppare un giocatore capace di leggere la situazione, scegliere ed eseguire assumendosi responsabilità.'],
['Concetti','Fondamentale acquisito','Leggere|Scegliere|Eseguire|Adattare|Vantaggio','CONCETTO → non basta saper fare il gesto.','Un fondamentale è realmente disponibile quando il giocatore sa riconoscere quando e perché usarlo, sceglierlo ed eseguirlo adattandolo alla situazione.'],
['Concetti','Creare vantaggio','Spazio|Difensore|Lettura|Scelta|Superare','TATTICA → modificare la situazione a favore dell’attacco.','Creo vantaggio quando una lettura e una scelta costringono la difesa a perdere equilibrio, posizione o tempo, generando uno spazio utile.'],
['Concetti','Mantenere vantaggio','Spaziatura|Continuità|Passaggio|Movimento|Collaborazione','TATTICA → non restituire alla difesa il vantaggio creato.','Dopo aver creato vantaggio continuo a muovere palla e giocatori con tempi e spaziature efficaci, leggendo gli aiuti difensivi.'],
['Concetti','Concretizzare vantaggio','Leggere|Continuare|Passare|Concludere|Canestro','TATTICA → trasformare il vantaggio in una conclusione efficace.','Il vantaggio viene concretizzato scegliendo il momento e la soluzione per arrivare a una conclusione efficace, direttamente o attraverso un compagno.'],
['Concetti','1c0 · Imparo','Gesto|Appoggi|Controllo|Correzione|Ripetizione','DIDATTICA → acquisizione senza opposizione.','Nel 1c0 isolo il fondamentale, verifico prerequisiti e correggo l’esecuzione; posso aggiungere stimoli percettivi senza trasformarli ancora in lettura del difensore.'],
['Concetti','1c1 · Leggo','Difensore|Spazio|Leggo|Scelgo|Eseguo','DIDATTICA → dal gesto alla decisione.','Nel 1c1 introduco l’opposizione: il giocatore legge comportamento del difensore e spazio, sceglie la soluzione e la esegue.'],
['Concetti','2c2 · Collaboro','Compagno|Aiuto|Spazio|Passaggio|Scelta','DIDATTICA → aggiungere collaborazione e seconda lettura.','Nel 2c2 il portatore legge anche aiuto difensivo e compagno: può continuare il proprio vantaggio o trasferirlo con un passaggio.'],
['Concetti','3c3 · Gioco','Spazio|Lettura|Scelta|Collaborazione|Vantaggio','DIDATTICA → trasferire il fondamentale al gioco.','Nel 3c3 verifico il trasferimento: il gesto non è obbligatorio, conta riconoscere la situazione e scegliere una soluzione coerente.'],
['Concetti','Leggere → scegliere → eseguire','Percepire|Capire|Decidere|Agire|Verificare','METODO → la tecnica è al servizio della scelta.','Il giocatore percepisce informazioni utili, interpreta la situazione, decide la risposta ed esegue; l’esito genera nuove informazioni da leggere.'],
['Concetti','Tecnica dal basso verso l’alto','Piedi|Baricentro|Busto|Mani/Palla|Sguardo','METODO → osservare il gesto in ordine corporeo.','Per analizzare e correggere parto dagli appoggi, salgo a caviglie e ginocchia, bacino/baricentro, busto e spalle, braccia e mani/palla, fino a testa e sguardo.'],
['Concetti','Attaccare lo spazio','Vedere|Orientarsi|Accelerare|Proteggere|Vantaggio','TATTICA → usare immediatamente uno spazio utile.','Quando riconosco spazio libero mi oriento e lo attacco con la soluzione tecnica adeguata, mantenendo controllo e protezione per creare o aumentare vantaggio.'],
['Concetti','Spaziatura','Distanze|Linee|Compagni|Difesa|Vantaggio','TATTICA → occupare spazi che rendano giocabile il vantaggio.','Le distanze tra attaccanti devono offrire linee utili, rendere difficili gli aiuti e permettere continuità senza comprimere lo spazio.']
];let active='Tutti';const cats=['Tutti',...new Set(D.map(x=>x[0]))];function render(){filters.innerHTML=cats.map(c=>`<button class="${c===active?'on':''}" onclick="active='${c}';render()">${c}</button>`).join('')+`<button class="print" onclick="window.print()">🖨 STAMPA / SALVA PDF</button>`;let a=active==='Tutti'?D:D.filter(x=>x[0]===active);count.textContent=a.length+' schede di memoria';grid.innerHTML=a.map((x,i)=>`<article class="card"><div class="cat">${x[0]}</div><h2>${x[1]}</h2><div class="words">${x[2].split('|').map(w=>`<span class="word">${w}</span>`).join('')}</div><div class="logic">${x[3]}</div><button class="show" onclick="let e=this.nextElementSibling;e.style.display=e.style.display==='block'?'none':'block';this.textContent=e.style.display==='block'?'NASCONDI':'SVILUPPA'">SVILUPPA</button><div class="answer">${x[4]}</div></article>`).join('')}render();</script></body></html>
